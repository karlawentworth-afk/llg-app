<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LLG Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --magenta: #DE0082;
      --magenta-dark: #B8006B;
      --charcoal: #2B2A29;
      --bg: #F7F4F0;
      --card-bg: #fff;
      --card-border: #E6E1DA;
      --muted: #5E5D5B;
      --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Mulish', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--charcoal);
      font-size: 16px;
      line-height: 1.5;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 1.25rem 1rem 3rem;
    }

    /* Typography */
    h1, h2, h3 { font-family: 'Poppins', 'Segoe UI', sans-serif; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.75rem; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.15rem; }
    .small { font-size: 0.875rem; color: var(--muted); }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card-dark {
      background: var(--charcoal);
      color: #fff;
      border: none;
    }
    .card-dark .small { color: #b0afad; }
    .card-dark .topic { color: var(--magenta); font-weight: 700; font-size: 1.1rem; }

    /* Buttons */
    .btn {
      display: inline-block;
      background: var(--magenta);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      font-family: 'Mulish', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      min-height: 48px;
      text-align: center;
    }
    .btn:active { opacity: 0.85; }
    .btn-outline {
      background: transparent;
      border: 2px solid var(--magenta);
      color: var(--magenta);
    }
    .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; min-height: 40px; }

    /* Tiles row */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .tile {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.1rem;
      text-align: center;
      cursor: pointer;
      min-height: 48px;
    }
    .tile-value { font-family: 'Poppins', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--charcoal); }
    .tile-label { font-size: 0.875rem; color: var(--muted); margin-top: 0.2rem; }

    /* Day strip */
    .day-strip { display: flex; gap: 0.4rem; overflow-x: auto; margin-bottom: 1rem; padding-bottom: 0.25rem; -webkit-overflow-scrolling: touch; }
    .day-strip::-webkit-scrollbar { display: none; }
    .day-chip {
      flex-shrink: 0;
      padding: 0.5rem 0.75rem;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      cursor: pointer;
      text-align: center;
      min-width: 56px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .day-chip.active { background: var(--magenta); color: #fff; border-color: var(--magenta); }
    .day-chip.day-empty { opacity: 0.4; }
    .day-chip .day-name { font-size: 0.75rem; font-weight: 400; }
    .day-dot { display: block; width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); margin: 0.15rem auto 0; }
    .day-chip.active .day-dot { background: #fff; }

    /* Session rows */
    .session-row {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-info { flex: 1; }
    .session-time { font-weight: 700; }
    .session-topic { color: var(--charcoal); font-weight: 600; }
    .session-meta { font-size: 0.875rem; color: var(--muted); }
    .session-action { flex-shrink: 0; margin-left: 0.75rem; }
    .badge-booked {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }
    .badge-full {
      background: #fff3e0;
      color: #e65100;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
    }

    /* Trips */
    .trips-scroll { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
    .trips-scroll::-webkit-scrollbar { display: none; }
    .trip-card {
      flex-shrink: 0;
      width: 220px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .trip-title { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.3rem; }
    .trip-meta { font-size: 0.875rem; color: var(--muted); }

    /* Perks */
    .perk-item { padding: 0.5rem 0; border-bottom: 1px solid var(--card-border); font-size: 0.95rem; }
    .perk-item:last-child { border-bottom: none; }

    /* Membership card overlay */
    .card-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .card-overlay.show { display: flex; }
    .member-card {
      background: var(--charcoal);
      color: #fff;
      border-radius: 20px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }
    .member-card .llg-mark { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .member-card .tier { color: var(--magenta); font-weight: 700; font-size: 1.1rem; }
    .member-card .name { font-size: 1.25rem; font-weight: 700; margin: 0.75rem 0 0.25rem; }
    .member-card .venue { color: #b0afad; }
    .member-card .dates { margin: 1rem 0; font-size: 0.9rem; color: #b0afad; }
    .member-card .live-clock { font-family: 'Mulish', monospace; font-size: 0.85rem; color: var(--magenta); margin: 0.75rem 0; }
    .member-card .points-line { margin: 0.75rem 0; }
    .member-card .earn-info { font-size: 0.85rem; color: #b0afad; }
    .member-card .perk-list { margin: 0.75rem 0; font-size: 0.9rem; }
    .member-card .perk-list li { margin-bottom: 0.3rem; list-style: none; }
    .member-card .perk-list li::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--magenta); margin-right: 0.5rem; vertical-align: middle; }
    .member-card .close-card { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; min-height: 48px; min-width: 48px; }
    .member-card .renew-note { font-size: 0.85rem; color: #b0afad; margin-top: 1rem; }
    .sheen {
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: sheen 4s infinite;
    }
    @keyframes sheen { 0% { left: -50%; } 100% { left: 150%; } }

    /* Venue picker */
    .venue-picker { margin-bottom: 1rem; }
    .venue-option {
      display: block;
      width: 100%;
      padding: 1rem;
      margin-bottom: 0.5rem;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 14px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Mulish', sans-serif;
      color: var(--charcoal);
      min-height: 48px;
    }
    .venue-option .venue-town { font-weight: 400; color: var(--muted); font-size: 0.875rem; }

    /* Link style */
    a.link { color: var(--magenta-dark); text-decoration: underline; font-weight: 600; }

    /* Skeleton */
    .skeleton { background: #e0ddd8; border-radius: var(--radius); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skel-greeting { height: 2rem; width: 60%; margin-bottom: 0.5rem; }
    .skel-subtitle { height: 1.2rem; width: 45%; margin-bottom: 1rem; }
    .skel-card { height: 140px; margin-bottom: 1rem; }
    .skel-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .skel-tile { height: 90px; }
    .skel-section { height: 200px; margin-bottom: 1rem; }

    /* Error */
    .error-msg { color: #c0392b; font-weight: 600; padding: 2rem 0; text-align: center; }

    /* Holding view */
    .holding { text-align: center; padding: 2rem 0; }
    .holding h1 { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Skeleton loading -->
    <div id="skeleton">
      <div class="skeleton skel-greeting"></div>
      <div class="skeleton skel-subtitle"></div>
      <div class="skeleton skel-card"></div>
      <div class="skel-tiles">
        <div class="skeleton skel-tile"></div>
        <div class="skeleton skel-tile"></div>
      </div>
      <div class="skeleton skel-section"></div>
    </div>

    <div id="content" style="display:none"></div>
    <div id="error" style="display:none"></div>
  </div>

  <!-- Membership card overlay -->
  <div class="card-overlay" id="cardOverlay" onclick="if(event.target===this)closeCard()">
    <div class="member-card" id="memberCard"></div>
  </div>

  <script>
    let DATA = null;
    let PASS = null;
    let selectedDay = 0;

    (async function () {
      // Temporary: log web view origin so we can restore CSP
      console.log("ORIGIN:", location.origin, "REFERRER:", document.referrer, "ANCESTORS:", window.location.ancestorOrigins ? [...window.location.ancestorOrigins] : "n/a");

      // Read pass from hash if present
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      PASS = params.get("p") || null;

      // Clear hash from address bar (no identifying data in URL)
      if (PASS && window.history.replaceState) {
        window.history.replaceState(null, "", window.location.pathname);
      }

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 9000);

        // Send pass if we have one; otherwise rely on session cookie
        const fetchBody = PASS ? { pass: PASS } : {};
        const res = await fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(fetchBody),
          signal: controller.signal,
        });
        clearTimeout(timer);

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          const msgs = {
            invalid_signature: "Access denied.",
            pass_expired: "Your session has expired. Please reload the page on the LLG website.",
            no_session: "Please open this page from the LLG app.",
            server_config: "Server configuration error. Please contact LLG.",
          };
          showError(msgs[err.error] || "Something went wrong. Please try again.");
          return;
        }

        DATA = await res.json();
        render();
      } catch (err) {
        showError(err.name === "AbortError" ? "Request timed out. Please try again." : "Could not connect. Please try again.");
      }
    })();

    function showError(msg) {
      document.getElementById("skeleton").style.display = "none";
      document.getElementById("error").style.display = "block";
      document.getElementById("error").innerHTML = `<p class="error-msg">${esc(msg)}</p>`;
    }

    function render() {
      document.getElementById("skeleton").style.display = "none";
      const el = document.getElementById("content");
      el.style.display = "block";

      if (!DATA.plan.eligible) {
        renderHolding(el);
        return;
      }

      renderHome(el);
    }

    function renderHolding(el) {
      const planText = DATA.plan.name ? `${esc(DATA.plan.name)} (${esc(DATA.plan.status)})` : "No active plan";
      const money = (DATA.points / 100).toFixed(2);
      el.innerHTML = `
        <div class="holding">
          <h1>${greeting()}, ${esc(DATA.firstName.split(" ")[0])}.</h1>
          <p class="subtitle">${planText}</p>
          <p style="margin-top:1rem;font-size:1.1rem"><strong>${Number(DATA.points).toLocaleString()} points</strong></p>
          <p class="small">Worth £${money}</p>
        </div>`;
    }

    function renderHome(el) {
      let html = "";

      // 1. Greeting
      html += `<h1>${greeting()}, ${esc(DATA.firstName.split(" ")[0])}.</h1>`;
      html += `<p class="subtitle">${formatDateLong(new Date())}</p>`;
      html += `<p style="margin:0.3rem 0 1rem;font-weight:600">Here's your golf week.</p>`;

      // 2. Next session
      html += renderNextSession();

      // 3. Points + membership tiles
      const money = (DATA.points / 100).toFixed(2);
      html += `<div class="tiles">
        <div class="tile">
          <div class="tile-value">£${money}</div>
          <div class="tile-label">to spend</div>
          <div class="small">${Number(DATA.points).toLocaleString()} points</div>
        </div>
        <div class="tile" onclick="showCard()">
          <div class="tile-value" style="font-size:1rem">${esc(DATA.plan.name)}</div>
          <div class="tile-label" style="color:var(--magenta-dark);font-weight:600">Show my card</div>
        </div>
      </div>`;

      // 4. Book at venue
      html += renderBookSection();

      // 5. Perks
      if (DATA.perks?.length > 0) {
        const venueName = DATA.homeVenue?.name || "your venue";
        html += `<h2>Your ${esc(venueName)} perks</h2>`;
        html += `<div class="card">`;
        DATA.perks.forEach(p => { html += `<div class="perk-item">${esc(p)}</div>`; });
        html += `<div style="margin-top:0.75rem"><a class="link" href="#" onclick="showCard();return false">Show card</a></div>`;
        html += `</div>`;
      }

      // 6. Trips
      if (DATA.events?.length > 0) {
        html += `<h2>Trips worth a look</h2>`;
        html += `<div class="trips-scroll">`;
        DATA.events.forEach(e => {
          html += `<div class="trip-card">
            <div class="trip-title">${sentenceCase(esc(e.title))}</div>
            <div class="trip-meta">${e.startDate ? formatDateLong(new Date(e.startDate)) : ""}</div>
            <div class="trip-meta">${esc(e.location)}</div>
          </div>`;
        });
        html += `</div>`;
      }

      el.innerHTML = html;
    }

    function renderNextSession() {
      const next = DATA.bookings?.[0];
      if (!next) {
        return `<div class="card card-dark">
          <p style="font-weight:600">Nothing booked yet</p>
          <p class="small" style="margin:0.5rem 0">Check out the sessions below and book your next one.</p>
        </div>`;
      }
      const start = next.startDate ? new Date(next.startDate) : null;
      const end = next.endDate ? new Date(next.endDate) : null;
      const topic = findTopicForBooking(next);
      return `<div class="card card-dark">
        ${topic ? `<div class="topic">${sentenceCase(esc(topic.title))}</div>` : ""}
        <p style="font-weight:700;font-size:1.05rem;margin:0.3rem 0">${esc(next.title)}</p>
        <p>${start ? formatDateLong(start) : "Date TBC"}</p>
        <p>${start ? formatTime(start) : ""}${end ? " to " + formatTime(end) : ""} | ${esc(next.locationName)}</p>
        <div style="margin-top:1rem">
          <a class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.3)" href="https://www.ladieslovegolf.com/bookings" target="_top">Can't make it?</a>
        </div>
        <p class="small" style="margin-top:0.5rem">You can move or cancel up to 24 hours before.</p>
      </div>`;
    }

    function renderBookSection() {
      // No home venue
      if (!DATA.homeVenue) {
        let html = `<h2>Where do you usually play?</h2><div class="venue-picker">`;
        (DATA.allVenues || []).forEach(v => {
          html += `<button class="venue-option" onclick="pickVenue('${v.id}')">
            ${esc(v.name)} <span class="venue-town">${v.town ? esc(v.town) : ""}</span>
          </button>`;
        });
        html += `</div>`;
        return html;
      }

      // Build 7-day strip
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      // Find which days have sessions
      const sessionDates = new Set((DATA.sessions || []).map(s => s.startDate?.substring(0, 10)).filter(Boolean));

      // Auto-select next day with sessions if current day has none
      if (selectedDay === 0) {
        for (let i = 0; i < days.length; i++) {
          if (sessionDates.has(days[i].toISOString().substring(0, 10))) {
            selectedDay = i;
            break;
          }
        }
      }

      let html = `<h2>Book at ${esc(DATA.homeVenue.name)}</h2>`;

      // Day strip with dots for days that have sessions
      html += `<div class="day-strip" id="dayStrip">`;
      days.forEach((d, i) => {
        const dayName = d.toLocaleDateString("en-GB", { weekday: "short" });
        const dayNum = d.getDate();
        const dateStr = d.toISOString().substring(0, 10);
        const hasSessions = sessionDates.has(dateStr);
        html += `<div class="day-chip ${i === selectedDay ? "active" : ""} ${!hasSessions ? "day-empty" : ""}" onclick="selectDay(${i})">
          <span class="day-name">${dayName}</span>
          <span>${dayNum}</span>
          ${hasSessions ? '<span class="day-dot"></span>' : ""}
        </div>`;
      });
      html += `</div>`;

      // Sessions for selected day
      const selDate = days[selectedDay];
      const selDateStr = selDate.toISOString().substring(0, 10);
      const daySessions = (DATA.sessions || []).filter(s => {
        if (!s.startDate) return false;
        return s.startDate.substring(0, 10) === selDateStr;
      });

      if (daySessions.length === 0) {
        // Find next available
        let nextAvail = null;
        for (const s of (DATA.sessions || [])) {
          if (s.startDate && new Date(s.startDate) > selDate) { nextAvail = s; break; }
        }
        if (nextAvail) {
          const nd = new Date(nextAvail.startDate);
          html += `<p class="small" style="padding:1rem 0">No sessions on this day. Next session: ${formatDateLong(nd)} at ${formatTime(nd)}.</p>`;
        } else {
          html += `<p class="small" style="padding:1rem 0">No sessions on this day.</p>`;
        }
      } else {
        daySessions.forEach((s, i) => {
          const start = new Date(s.startDate);
          const end = s.endDate ? new Date(s.endDate) : null;
          const topicTitle = s.topic?.title ? sentenceCase(s.topic.title) : "";
          const placesLeft = s.remainingCapacity;
          const isFull = placesLeft === 0;

          const bookUrl = buildBookingUrl(s);
          let actionHtml;
          if (s.isBooked) {
            actionHtml = `<span class="badge-booked">You're booked</span>`;
          } else if (isFull && DATA.plan.eligible) {
            actionHtml = `<a class="btn btn-sm" style="background:#e65100" href="${bookUrl}" onclick="tapBookBtn(this)">Waitlist</a>`;
          } else if (isFull) {
            actionHtml = `<span class="badge-full">Full</span>`;
          } else {
            actionHtml = `<a class="btn btn-sm" href="${bookUrl}" onclick="tapBookBtn(this)">Book</a>`;
          }

          // Long description behind More/Less
          const descId = `desc-${selectedDay}-${i}`;
          let descHtml = "";
          if (s.topic?.description) {
            const desc = esc(s.topic.description);
            descHtml = `<div class="small" style="margin:0.2rem 0 0.3rem">
              <a class="link" style="font-size:0.85rem" id="${descId}-more" onclick="toggleDesc('${descId}');return false" href="#">More</a>
              <div id="${descId}-full" style="display:none">${desc} <a class="link" style="font-size:0.85rem" onclick="toggleDesc('${descId}');return false" href="#">Less</a></div>
            </div>`;
          }

          html += `<div class="session-row">
            <div class="session-info">
              <div class="session-time">${formatTime(start)}${end ? " to " + formatTime(end) : ""}</div>
              ${topicTitle ? `<div class="session-topic">${esc(topicTitle)}</div>` : ""}
              ${descHtml}
              <div class="session-meta">${placesLeft} place${placesLeft !== 1 ? "s" : ""} left | £12.50 member price</div>
            </div>
            <div class="session-action">${actionHtml}</div>
          </div>`;
        });
      }

      html += `<p style="margin-top:0.5rem"><a class="link" href="#" onclick="showVenuePicker();return false">Other venues</a></p>`;

      return html;
    }

    function findTopicForBooking(booking) {
      if (!booking.startDate || !DATA.sessions) return null;
      const bookingStart = new Date(booking.startDate);
      for (const s of DATA.sessions) {
        if (s.topic && s.startDate) {
          const sStart = new Date(s.startDate);
          if (Math.abs(sStart.getTime() - bookingStart.getTime()) < 2 * 60 * 60 * 1000) {
            return s.topic;
          }
        }
      }
      return null;
    }

    function selectDay(i) {
      selectedDay = i;
      render();
    }

    function showVenuePicker() {
      DATA.homeVenue = null;
      DATA.homeVenueSource = "none";
      render();
    }

    async function pickVenue(venueId) {
      const venue = (DATA.allVenues || []).find(v => v.id === venueId);
      if (!venue) return;

      // Save preference
      try {
        await fetch("/.netlify/functions/set-home-venue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ pass: PASS, venueId }),
        });
      } catch {}

      // Reload to get venue-specific data
      document.getElementById("content").style.display = "none";
      document.getElementById("skeleton").style.display = "block";

      try {
        const fetchBody = PASS ? { pass: PASS, skipCache: true } : { skipCache: true };
        const res = await fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(fetchBody),
        });
        if (res.ok) {
          DATA = await res.json();
          selectedDay = 0;
          render();
        }
      } catch {}
    }

    // --- Membership card ---

    function showCard() {
      const card = document.getElementById("memberCard");
      const renewDate = DATA.plan.endDate ? formatDateLong(new Date(DATA.plan.endDate)) : "N/A";
      const sinceDate = DATA.plan.startDate ? formatDateLong(new Date(DATA.plan.startDate)) : "N/A";
      const money = (DATA.points / 100).toFixed(2);
      const venueName = DATA.homeVenue?.name || "";

      let perksHtml = "";
      if (DATA.perks?.length > 0) {
        perksHtml = `<ul class="perk-list">${DATA.perks.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;
      }

      card.innerHTML = `
        <div class="sheen"></div>
        <button class="close-card" onclick="closeCard()">&times;</button>
        <div class="llg-mark">llg</div>
        <div class="tier">${esc(DATA.plan.name)}</div>
        <div class="name">${esc(DATA.firstName)}</div>
        <div class="venue">${esc(venueName)}</div>
        <div class="dates">Member since ${sinceDate}<br>Renews ${renewDate}</div>
        <div class="live-clock" id="liveClock"></div>
        <div class="points-line">
          <strong>£${money}</strong> to spend <span class="small">(${Number(DATA.points).toLocaleString()} points)</span>
        </div>
        <div class="earn-info">Earn: 15 points per session, 1 point per £1 on events and Golf Breaks holidays</div>
        ${perksHtml}
        <div class="renew-note">Renews on ${renewDate}. Manage or cancel up to 7 days before.</div>
      `;

      document.getElementById("cardOverlay").classList.add("show");
      updateClock();
      window._clockInterval = setInterval(updateClock, 1000);
    }

    function closeCard() {
      document.getElementById("cardOverlay").classList.remove("show");
      if (window._clockInterval) clearInterval(window._clockInterval);
    }

    function updateClock() {
      const el = document.getElementById("liveClock");
      if (!el) return;
      const now = new Date();
      const day = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
      const time = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      el.textContent = `Valid today, ${day}, ${time}`;
    }

    // --- Formatting ---

    function greeting() {
      const h = new Date().getHours();
      if (h < 12) return "Morning";
      if (h < 17) return "Afternoon";
      return "Evening";
    }

    function formatDateLong(d) {
      return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
    }

    // Build Wix booking form deep link for a specific session
    // From docs: Wix tutorial "Build a Custom Booking Calendar Page"
    function tapBookBtn(el) {
      el.textContent = "Opening booking...";
      el.style.opacity = "0.6";
      el.style.pointerEvents = "none";
    }

    function toggleDesc(id) {
      const moreLink = document.getElementById(id + "-more");
      const full = document.getElementById(id + "-full");
      if (full.style.display === "none") {
        full.style.display = "";
        moreLink.style.display = "none";
      } else {
        full.style.display = "none";
        moreLink.style.display = "";
      }
    }

    function buildBookingUrl(session) {
      const params = new URLSearchParams();
      if (session.serviceId) params.set("bookings_serviceId", session.serviceId);
      if (session.resourceId) params.set("bookings_resourceId", session.resourceId);
      if (session.startDate) params.set("bookings_startDate", session.startDate);
      if (session.endDate) params.set("bookings_endDate", session.endDate);
      params.set("bookings_timezone", session.timeZone || "Europe/London");
      return "https://www.ladieslovegolf.com/booking-form?" + params.toString();
    }

    function formatTime(d) {
      let h = d.getHours();
      let m = d.getMinutes();
      const ampm = h >= 12 ? "pm" : "am";
      if (h > 12) h -= 12;
      if (h === 0) h = 12;
      return m === 0 ? `${h}${ampm}` : `${h}.${String(m).padStart(2, "0")}${ampm}`;
    }

    function sentenceCase(str) {
      if (!str) return "";
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function esc(str) {
      const d = document.createElement("div");
      d.textContent = String(str || "");
      return d.innerHTML;
    }
  </script>
</body>
</html>
