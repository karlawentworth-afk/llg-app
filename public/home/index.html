<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mg: #DE0082;
      --mg-dark: #B8006B;
      --charcoal: #2B2A29;
      --bg: #F7F4F0;
      --card: #fff;
      --border: #E6E1DA;
      --muted: #5E5D5B;
      --r: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { min-height: 100vh; font-family: 'Mulish','Segoe UI',sans-serif; background: var(--bg); color: var(--charcoal); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    input, select, textarea { font-size: 16px; }
    h1,h2,h3 { font-family: 'Poppins','Segoe UI',sans-serif; }
    a { text-decoration: none; color: inherit; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .small { font-size: 0.875rem; color: var(--muted); }
    .mg { color: var(--mg-dark); font-weight: 700; }

    /* Cards */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 1.1rem; margin-bottom: 0.75rem; }
    .card-dark { background: var(--charcoal); color: #fff; border: none; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--mg); color: #fff; border: none; border-radius: 12px; padding: 0 1.25rem; font-family: 'Mulish',sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 44px; }
    .btn:active { opacity: 0.85; }
    .btn-sm { min-height: 40px; padding: 0 1rem; font-size: 0.875rem; }
    .btn-dark { background: var(--charcoal); }
    .btn-outline { background: transparent; border: 2px solid var(--mg); color: var(--mg); }
    .pill { display: inline-flex; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 0.35rem 0.85rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; min-height: 36px; color: var(--charcoal); text-decoration: none; }

    /* Trip banner */
    .trip-banner { background: var(--mg); color: #fff; border-radius: 14px; padding: 0.7rem 1rem; margin-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; min-height: 44px; text-decoration: none; }
    .trip-banner:active { opacity: 0.85; }

    /* Next session card */
    .next-sess { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem; margin-bottom: 0.75rem; }
    .next-sess-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.4rem; }

    /* Tiles */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.75rem; }
    .tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem; cursor: pointer; min-height: 44px; text-decoration: none; display: block; }
    .tile:active { background: #f0ede8; }
    .tile-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.3rem; }
    .tile-value { font-family: 'Poppins',sans-serif; font-size: 1.3rem; font-weight: 700; }
    .tile-sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }

    /* Day strip */
    .day-strip { display: flex; gap: 0.35rem; overflow-x: auto; margin-bottom: 0.75rem; padding-bottom: 0.2rem; -webkit-overflow-scrolling: touch; }
    .day-strip::-webkit-scrollbar { display: none; }
    .day-chip { flex-shrink: 0; padding: 0.4rem 0.6rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; background: var(--card); border: 1px solid var(--border); cursor: pointer; text-align: center; min-width: 52px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .day-chip.active { background: var(--mg); color: #fff; border-color: var(--mg); }
    .day-chip.empty { background: #eae7e3; border-color: #ddd9d4; color: var(--muted); }
    .day-chip .dn { font-size: 0.7rem; font-weight: 400; }
    .day-dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--mg); margin: 0.1rem auto 0; }
    .day-chip.active .day-dot { background: #fff; }

    /* Session rows */
    .sess { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 0.9rem 1rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
    .sess-info { flex: 1; min-width: 0; }
    .sess-time { font-weight: 700; font-size: 0.95rem; }
    .sess-topic { font-weight: 600; }
    .sess-meta { font-size: 0.875rem; color: var(--muted); }
    .sess-meta .low { color: var(--mg); font-weight: 700; }
    .sess-desc { font-size: 0.875rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 0.2rem 0; }
    .sess-desc.open { -webkit-line-clamp: unset; display: block; }
    .more-btn { background: none; border: none; color: var(--mg-dark); font-weight: 700; font-size: 0.85rem; cursor: pointer; padding: 0.3rem 0; min-height: 44px; display: flex; align-items: center; text-decoration: none; }
    .badge { font-size: 0.8rem; font-weight: 700; padding: 0.4rem 0.75rem; border-radius: 8px; white-space: nowrap; text-align: center; min-height: 36px; display: inline-flex; align-items: center; }
    .badge-booked { background: #e8f5e9; color: #2e7d32; }
    .badge-full { background: var(--bg); color: var(--muted); }

    /* Trips scroll */
    .trips-scroll { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.5rem; -webkit-overflow-scrolling: touch; }
    .trips-scroll::-webkit-scrollbar { display: none; }
    .trip-card { flex-shrink: 0; width: 240px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; cursor: pointer; text-decoration: none; display: block; }
    .trip-card:active { opacity: 0.85; }
    .trip-card img { width: 100%; height: 120px; object-fit: cover; display: block; }
    .trip-card-body { padding: 0.75rem; }
    .trip-card-title { font-family: 'Poppins',sans-serif; font-weight: 600; font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0.3rem; }
    .trip-card-meta { font-size: 0.8rem; color: var(--muted); }
    .trip-card-price { font-weight: 700; margin-top: 0.3rem; }
    .trip-card-view { color: var(--mg-dark); font-weight: 700; font-size: 0.85rem; margin-top: 0.3rem; }

    /* Your trips list */
    .your-trip { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 0.6rem 1rem; margin-bottom: 0.35rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; min-height: 44px; text-decoration: none; }
    .your-trip:active { opacity: 0.85; }

    /* Perks */
    .perk { padding: 0.45rem 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    .perk:last-child { border-bottom: none; }

    /* Heading row */
    .hrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; gap: 0.5rem; }
    .hrow h2 { font-size: 1.1rem; font-weight: 600; margin: 0; }

    /* Card screen */
    .screen { display: none; }
    .screen.active { display: block; }
    .card-screen .back { display: inline-flex; align-items: center; gap: 0.3rem; background: none; border: none; color: var(--mg-dark); font-weight: 700; font-size: 0.95rem; cursor: pointer; padding: 0.5rem 0; min-height: 44px; margin-bottom: 0.75rem; text-decoration: none; }
    .member-card { background: var(--charcoal); color: #fff; border-radius: 16px; padding: 1.25rem; position: relative; overflow: hidden; }
    .member-card .logo { height: 36px; margin-bottom: 0.6rem; }
    .member-card .tier { color: var(--mg); font-weight: 700; font-size: 1rem; }
    .member-card .name { font-size: 1.15rem; font-weight: 700; margin: 0.4rem 0 0.15rem; }
    .member-card .venue { color: #b0afad; font-size: 0.9rem; }
    .member-card .valid-strip { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; padding: 0.5rem 0.75rem; background: rgba(255,255,255,0.08); border-radius: 10px; font-size: 0.85rem; }
    .member-card .valid-dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
    .member-card .clock { color: #FFB3DC; font-family: 'Mulish',monospace; }
    .sheen { position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent); animation: sheen 4s infinite; pointer-events: none; }
    @keyframes sheen { 0% { left: -50%; } 100% { left: 150%; } }

    /* Trip screen */
    .trip-hero { width: 100%; height: 200px; object-fit: cover; border-radius: 0 0 var(--r) var(--r); display: block; }
    .trip-hero-wrap { position: relative; margin: -1.25rem -1rem 1rem; }
    .trip-hero-wrap .back { position: absolute; top: 0.75rem; left: 0.75rem; background: rgba(0,0,0,0.4); color: #fff; border: none; border-radius: 8px; padding: 0.4rem 0.8rem; font-weight: 600; font-size: 0.85rem; cursor: pointer; min-height: 36px; text-decoration: none; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
    .chip { background: #f0ede8; border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.8rem; font-weight: 600; }
    .trip-bar { background: var(--charcoal); color: #fff; border-radius: 14px; padding: 1rem; margin-top: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .trip-bar-price { font-family: 'Poppins',sans-serif; font-size: 1.2rem; font-weight: 700; }
    .trip-bar .btn { background: var(--mg); }

    /* === HOME LOADER === */
    .llg-load{position:fixed;inset:0;z-index:9999;background:#F7F4F0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;font-family:Mulish,"Segoe UI",sans-serif;color:#2B2A29;transition:opacity .3s ease}
    .llg-load.is-done{opacity:0;pointer-events:none}
    .llg-load-logo{width:90px;height:auto;display:block}
    .llg-scene{position:relative;width:280px;height:150px}
    .llg-scene-svg{position:absolute;left:0;top:0}
    .llg-ball{position:absolute;left:40px;top:90px;width:18px;height:18px;animation:llgRoll 2.8s cubic-bezier(.25,.6,.35,1) infinite}
    .llg-ball-spin{animation:llgSpin 2.8s linear infinite;transform-origin:9px 9px}
    .llg-heart{position:absolute;left:216px;top:88px;animation:llgHeart 2.8s ease-out infinite;transform-origin:center bottom}
    .llg-flag{animation:llgFlag 1.4s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
    .llg-msg{margin:0;height:28px;font-size:18px;font-weight:600;animation:llgFade 2s ease-in-out infinite}
    .llg-dots{display:flex;gap:8px}
    .llg-dots span{display:block;width:8px;height:8px;border-radius:999px;background:#E6E1DA;transition:all .3s ease}
    .llg-dots span.on{background:#DE0082}
    .llg-dots span.now{width:22px;background:#DE0082}
    @keyframes llgRoll{0%{transform:translate(0,0);opacity:0}8%{opacity:1}62%{transform:translate(168px,0)}70%{transform:translate(176px,4px) scale(.9)}78%{transform:translate(178px,10px) scale(.25);opacity:1}80%{opacity:0}100%{transform:translate(178px,10px) scale(.2);opacity:0}}
    @keyframes llgSpin{from{transform:rotate(0)}to{transform:rotate(720deg)}}
    @keyframes llgHeart{0%,76%{transform:translateY(0) scale(0);opacity:0}84%{transform:translateY(-26px) scale(1.15);opacity:1}94%{transform:translateY(-34px) scale(1);opacity:1}100%{transform:translateY(-40px) scale(.9);opacity:0}}
    @keyframes llgFlag{0%,100%{transform:skewY(0)}50%{transform:skewY(-6deg)}}
    @keyframes llgFade{0%{opacity:0;transform:translateY(6px)}15%,85%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-6px)}}

    /* === CHECKOUT LOADER === */
    .llg-book{position:fixed;inset:0;z-index:9999;background:#2B2A29;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 36px;font-family:Mulish,"Segoe UI",sans-serif;text-align:center}
    .llg-book[hidden]{display:none}
    .llg-shot{position:relative;width:300px;height:160px;margin-bottom:8px}
    .llg-shot-svg{position:absolute;left:0;top:0;overflow:visible}
    .llg-fly{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:999px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.6);offset-path:path('M 40 128 Q 150 -30 250 108');offset-rotate:0deg;animation:llgFly 2.6s cubic-bezier(.3,.1,.4,1) infinite}
    .llg-trail{stroke-dasharray:300;animation:llgTrail 2.6s cubic-bezier(.3,.1,.4,1) infinite,llgTrailFade 2.6s linear infinite}
    .llg-land{animation:llgLand 2.6s ease-out infinite;transform-origin:250px 110px;transform-box:view-box}
    .llg-book-logo{width:64px;height:auto}
    .llg-book-title{margin:0;font-family:Poppins,"Segoe UI",sans-serif;font-size:22px;font-weight:700}
    .llg-book-step{margin:0;font-size:16px;color:#E8E6E3;animation:llgPulse 1.6s ease-in-out infinite}
    .llg-bar-track{width:100%;max-width:320px;height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
    .llg-bar{height:8px;width:6%;border-radius:999px;background:#DE0082}
    .llg-book.is-running .llg-bar{animation:llgFill 9s cubic-bezier(.2,.7,.3,1) forwards}
    .llg-book-note{margin:0;font-size:14px;color:#C9C6C2}
    @keyframes llgFly{0%,12%{offset-distance:0%;opacity:1}72%,80%{offset-distance:100%;opacity:1}90%,100%{offset-distance:100%;opacity:0}}
    @keyframes llgTrail{0%,12%{stroke-dashoffset:300}72%,100%{stroke-dashoffset:0}}
    @keyframes llgTrailFade{0%,80%{opacity:1}92%,100%{opacity:0}}
    @keyframes llgLand{0%,72%{transform:scale(0);opacity:0}78%{transform:scale(1.4);opacity:.6}90%,100%{transform:scale(2.2);opacity:0}}
    @keyframes llgFill{0%{width:6%}40%{width:55%}75%{width:80%}100%{width:92%}}
    @keyframes llgPulse{0%,100%{opacity:1}50%{opacity:.45}}

    @media (prefers-reduced-motion:reduce){.llg-ball,.llg-ball-spin,.llg-heart,.llg-flag,.llg-msg{animation:none}.llg-ball{transform:translate(120px,0)}.llg-fly,.llg-trail,.llg-land,.llg-book-step{animation:none}.llg-fly{display:none}}

    /* Skeleton */
    .skel { background: #e0ddd8; border-radius: var(--r); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skel-section { margin-bottom: 0.75rem; }

    /* Avatar */
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--charcoal); color: #fff; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .avatar:active { opacity: 0.8; }

    /* Trip about content */
    .trip-about p { margin-bottom: 0.5rem; }
    .trip-about h1,.trip-about h2,.trip-about h3,.trip-about h4 { font-size: 1.1rem; font-weight: 700; margin: 0.75rem 0 0.3rem; }
    .trip-about ul,.trip-about ol { margin: 0.5rem 0; padding-left: 1.25rem; }
    .trip-about li { margin-bottom: 0.25rem; }

    .error-msg { color: #c0392b; font-weight: 600; padding: 2rem 0; text-align: center; }
    .holding { text-align: center; padding: 2rem 0; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <!-- HOME LOADER -->
    <div id="llg-home-loader" class="llg-load" role="status" aria-live="polite">
      <img class="llg-load-logo" src="/img/llg-logo.png" alt="Ladies Love Golf" width="90">
      <div class="llg-scene" aria-hidden="true">
        <svg width="280" height="150" viewBox="0 0 280 150" class="llg-scene-svg">
          <ellipse cx="140" cy="112" rx="136" ry="30" fill="#E3EDE3"/>
          <ellipse cx="140" cy="112" rx="108" ry="21" fill="#D3E3D3"/>
          <ellipse cx="227" cy="108" rx="11" ry="4" fill="#2B2A29"/>
          <line x1="227" y1="108" x2="227" y2="30" stroke="#2B2A29" stroke-width="2.5" stroke-linecap="round"/>
          <g class="llg-flag"><path d="M227 31 L262 41 L227 52 Z" fill="#DE0082"/></g>
        </svg>
        <div class="llg-ball"><svg class="llg-ball-spin" width="18" height="18" viewBox="0 0 18 18">
          <circle cx="9" cy="9" r="8" fill="#fff" stroke="#C9C3BA"/>
          <circle cx="6" cy="7" r="1" fill="#D9D3CB"/><circle cx="10" cy="5" r="1" fill="#D9D3CB"/>
          <circle cx="12" cy="10" r="1" fill="#D9D3CB"/><circle cx="7" cy="12" r="1" fill="#D9D3CB"/>
        </svg></div>
        <svg class="llg-heart" width="22" height="22" viewBox="0 0 24 24" fill="#DE0082"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.2 0 3.9 1.2 5.2 3 1.3-1.8 3-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
      </div>
      <p class="llg-msg">Lining up your putt...</p>
      <div class="llg-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </div>

    <!-- CHECKOUT LOADER -->
    <div id="llg-book-loader" class="llg-book" role="status" aria-live="polite" hidden>
      <div class="llg-shot" aria-hidden="true">
        <svg width="300" height="160" viewBox="0 0 300 160" class="llg-shot-svg">
          <path d="M0 136 Q150 120 300 136 L300 160 L0 160 Z" fill="#3A4A3F"/>
          <ellipse cx="250" cy="112" rx="34" ry="8" fill="#4F6B55"/>
          <circle class="llg-land" cx="250" cy="110" r="10" fill="none" stroke="#FFB3DC" stroke-width="2"/>
          <line x1="258" y1="112" x2="258" y2="62" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M258 63 L284 71 L258 79 Z" fill="#DE0082"/>
          <path class="llg-trail" d="M40 128 Q150 -30 250 108" fill="none" stroke="#FFB3DC" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/>
          <rect x="37" y="130" width="6" height="10" rx="1" fill="#fff"/>
        </svg>
        <div class="llg-fly"></div>
      </div>
      <img class="llg-book-logo" src="/img/llg-logo-white.svg" alt="" width="64">
      <p class="llg-book-title">Getting your booking ready</p>
      <p class="llg-book-step">Holding your place...</p>
      <div class="llg-bar-track"><div class="llg-bar"></div></div>
      <p class="llg-book-note">You'll pay securely on the next screen</p>
    </div>

    <!-- Home screen -->
    <div id="homeScreen" class="screen"></div>

    <!-- Card screen -->
    <div id="cardScreen" class="screen card-screen"></div>

    <!-- Trip screen -->
    <div id="tripScreen" class="screen"></div>

    <!-- All trips screen -->
    <div id="allTripsScreen" class="screen card-screen"></div>

    <!-- Account screen -->
    <div id="accountScreen" class="screen card-screen"></div>

    <!-- Error -->
    <div id="error" style="display:none"></div>
  </div>

  <script>
    var USE_APP_BOOK = false;
    var USE_DIRECT_CHECKOUT = false; // Spike parked: too slow (4 API calls + 2 redirects)

    // === HOME LOADER ===
    (function(){
      var el=document.getElementById('llg-home-loader'); if(!el) return;
      var msgs=['Lining up your putt...','Finding your sessions...','Counting your points...','Nearly on the green...'];
      var msg=el.querySelector('.llg-msg'), dots=el.querySelectorAll('.llg-dots span'), i=0;
      function paint(){ msg.textContent=msgs[i]; dots.forEach(function(d,n){ d.className=(n<i?'on':'')+(n===i?' now':''); }); }
      paint();
      var t=setInterval(function(){ i=(i+1)%msgs.length; paint(); },2000);
      window.hideHomeLoader=function(){ clearInterval(t); el.classList.add('is-done'); setTimeout(function(){ el.remove(); },350); };
    })();

    // === CHECKOUT LOADER ===
    window.showBookLoader=function(){
      var el=document.getElementById('llg-book-loader'); if(!el) return;
      var steps=['Holding your place...','Applying your member price...','Nearly there...'], i=0;
      var s=el.querySelector('.llg-book-step');
      el.hidden=false; el.classList.add('is-running');
      clearInterval(window.__llgBookT);
      window.__llgBookT=setInterval(function(){ i=(i+1)%steps.length; s.textContent=steps[i]; },2400);
    };
    // Hide booking loader if user comes back (bfcache)
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) {
        var el=document.getElementById('llg-book-loader');
        if (el) { el.hidden=true; el.classList.remove('is-running'); clearInterval(window.__llgBookT); }
      }
    });

    var DATA = null;
    var PASS = null;
    var selectedDay = -1;
    var currentScreen = "home";
    var ALL_TRIPS = []; // combined yourTrips + events, looked up by index

    // Event delegation for taps
    document.getElementById("app").addEventListener("click", function(e) {
      // Trip taps
      var tripEl = e.target.closest("[data-trip-idx]");
      if (tripEl) {
        var idx = parseInt(tripEl.getAttribute("data-trip-idx"), 10);
        if (ALL_TRIPS[idx]) showScreen("trip", ALL_TRIPS[idx]);
        return;
      }
      // Portal link
      var portalEl = e.target.closest("[data-portal-event]");
      if (portalEl) {
        openPortal(portalEl);
        return;
      }
      // Screen navigation (avatar, tiles, etc.)
      var screenEl = e.target.closest("[data-screen]");
      if (screenEl) {
        showScreen(screenEl.getAttribute("data-screen"));
      }
    });

    var WIX_PASS_URL = "https://www.ladieslovegolf.com/app-home-test";

    (async function () {
      var hash = window.location.hash.slice(1);
      var params = new URLSearchParams(hash);
      PASS = params.get("p") || null;
      var justBooked = params.get("booked") === "1";
      if (PASS && window.history.replaceState) {
        window.history.replaceState(null, "", window.location.pathname);
      }

      // Try loading data: with pass if we have one, or with session cookie
      try {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 9000);
        var fetchBody = PASS ? { pass: PASS } : {};
        if (justBooked) fetchBody.skipCache = true;
        var res = await fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(fetchBody),
          signal: controller.signal,
        });
        clearTimeout(timer);

        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });

          // No session and no pass: redirect to Wix to get a pass
          if (err.error === "no_session" || err.error === "pass_expired" || err.error === "invalid_signature") {
            // Only redirect once — prevent loops
            if (!PASS && !window.location.hash.includes("retry")) {
              window.location.href = WIX_PASS_URL;
              return;
            }
          }

          var msgs = {
            invalid_signature: "Access denied.",
            pass_expired: "Session expired. Redirecting...",
            no_session: "Please open this page from the LLG app.",
            server_config: "Server configuration error. Please contact LLG.",
          };
          showError(msgs[err.error] || "Something went wrong. Please try again.");
          return;
        }

        DATA = await res.json();
        showScreen("home");
      } catch (err) {
        showError(err.name === "AbortError" ? "Request timed out. Please try again." : "Could not connect. Please try again.");
      }
    })();

    function showError(msg) {
      if (window.hideHomeLoader) window.hideHomeLoader();
      var el = document.getElementById("error");
      el.style.display = "block";
      el.innerHTML = '<p class="error-msg">' + esc(msg) + '</p>';
    }

    function showScreen(name, extra) {
      if (window.hideHomeLoader) window.hideHomeLoader();
      ["homeScreen","cardScreen","tripScreen","allTripsScreen","accountScreen"].forEach(function(id) {
        document.getElementById(id).classList.remove("active");
      });

      currentScreen = name;

      if (name === "home") {
        if (!DATA.plan.eligible) { renderHolding(); return; }
        renderHome();
        document.getElementById("homeScreen").classList.add("active");
        trackEvent("home_opened");
      } else if (name === "allTrips") {
        renderAllTrips();
        document.getElementById("allTripsScreen").classList.add("active");
        trackEvent("all_trips_opened");
      } else if (name === "card") {
        renderCard();
        document.getElementById("cardScreen").classList.add("active");
        trackEvent("card_opened");
      } else if (name === "account") {
        renderAccount();
        document.getElementById("accountScreen").classList.add("active");
        trackEvent("account_opened");
      } else if (name === "trip") {
        renderTrip(extra);
        document.getElementById("tripScreen").classList.add("active");
      }
    }

    function renderBookSection() {
      if (!DATA.homeVenue) {
        var h = '<h2 style="font-size:1.1rem;margin-bottom:0.5rem">Where do you usually play?</h2>';
        (DATA.allVenues || []).forEach(function(v) {
          h += '<button class="card" style="width:100%;text-align:left;cursor:pointer;border:2px solid var(--border);font-size:1rem;font-weight:600;font-family:inherit;color:var(--charcoal);min-height:44px;margin-bottom:0.4rem" onclick="pickVenue(\'' + v.id + '\')">' +
            esc(v.name) + ' <span class="small">' + (v.town ? esc(v.town) : "") + '</span>' +
          '</button>';
        });
        return h;
      }

      var days = [];
      for (var i = 0; i < 7; i++) { var d = new Date(); d.setDate(d.getDate() + i); days.push(d); }

      var sessionDates = new Set((DATA.sessions || []).map(function(s) { return s.startDate ? s.startDate.substring(0, 10) : ""; }).filter(Boolean));

      // Auto-select first day with sessions
      if (selectedDay < 0) {
        selectedDay = 0;
        for (var i = 0; i < days.length; i++) {
          if (sessionDates.has(days[i].toISOString().substring(0, 10))) { selectedDay = i; break; }
        }
      }

      var vn = dropThe(DATA.homeVenue ? DATA.homeVenue.name || "" : "venue");
      var h = '<div class="hrow">' +
        '<h2>Book at ' + esc(vn) + '</h2>' +

      '</div>';

      // Day strip
      h += '<div class="day-strip">';

        var dn = i === 0 ? "Today" : d.toLocaleDateString("en-GB", { weekday: "short" });
        var num = d.getDate();
        var ds = d.toISOString().substring(0, 10);
        var has = sessionDates.has(ds);
        h += '<div class="day-chip ' + (i === selectedDay ? "active" : "") + ' ' + (!has ? "empty" : "") + '" onclick="selectDay(' + i + ')">' +
          '<span class="dn">' + dn + '</span><span>' + num + '</span>' +
          (has ? '<span class="day-dot"></span>' : "") +
        '</div>';
      });
      h += '</div>';

      // Sessions
      var selDateStr = days[selectedDay].toISOString().substring(0, 10);
      var daySess = (DATA.sessions || []).filter(function(s) { return s.startDate ? s.startDate.substring(0, 10) === selDateStr : false; });

      if (daySess.length === 0) {
        var nextAvail = null;
        for (var j = 0; j < (DATA.sessions || []).length; j++) {
          var ns = DATA.sessions[j];
          if (ns.startDate && new Date(ns.startDate) > days[selectedDay]) { nextAvail = ns; break; }
        }
        h += '<p class="small" style="padding:0.75rem 0">' + (nextAvail
          ? 'No sessions this day. Next: ' + fmtLong(new Date(nextAvail.startDate)) + ' at ' + fmtTime(new Date(nextAvail.startDate)) + '.'
          : 'No sessions that day. Days with a dot have sessions.') + '</p>';

        daySess.forEach(function(s, i) {
          var start = s.startDate;
          var end = s.endDate || null;
          var topic = s.topic && s.topic.title ? sentenceCase(s.topic.title) : "";
          var places = s.remainingCapacity;
          var full = places === 0;
          var lowPlaces = places > 0 && places <= 3;
          var price = DATA.memberPrice || "12.50";

          var bookUrl = buildBookingUrl(s);
          var priceNum = parseFloat(price);
          var ptsNeeded = Math.ceil(priceNum * 100);
          var canUsePoints = DATA.plan.eligible && !full && !s.isBooked && DATA.points >= ptsNeeded && priceNum > 0;

          var action;
          if (s.isBooked) {
            action = '<div style="text-align:center"><span class="badge badge-booked">You\'re booked</span>' +
              '<div style="margin-top:0.3rem"><a class="mg" style="font-size:0.8rem" href="https://www.ladieslovegolf.com/account/my-bookings" onclick="tapNav(this)">Manage</a></div></div>';
          } else if (full && DATA.plan.eligible) {
            var waitlistUrl = "https://www.ladieslovegolf.com/booking-calendar?bookings_serviceId=" + encodeURIComponent(s.serviceId);
            action = '<a class="btn btn-sm" style="background:#fff;color:var(--mg-dark);border:1.5px solid var(--mg)" href="' + waitlistUrl + '" onclick="tapWaitlist(this)">Join waitlist</a>';
          } else if (full) {
            action = '<span class="badge badge-full">Full</span>';

            action = '<a class="btn btn-sm" href="' + bookUrl + '" onclick="tapBookBtn(this)">Book</a>';

          var pointsHtml = "";
          if (canUsePoints) {
            pointsHtml = '<div style="width:100%;margin-top:0.4rem;padding-top:0.4rem;border-top:1px solid var(--border)">' +
              '<button class="btn btn-sm btn-outline" style="width:100%;font-size:0.85rem" onclick="usePoints(\'' + s.serviceId + '\',\'' + (s.startDate || "") + '\',' + ptsNeeded + ',' + priceNum + ',\'' + bookUrl + '\',this)">Or use ' + pts(ptsNeeded) + ' points (\u00a3' + priceNum.toFixed(2) + ')</button>' +
              '<div style="font-size:0.75rem;color:var(--muted);margin-top:0.3rem;line-height:1.4">Points work just like paying: you can move your session up to 24 hours before, but cancelled sessions aren\'t refunded.</div>' +
            '</div>';

          var descId = "d" + selectedDay + i;
          var descHtml = "";
          if (s.topic && s.topic.description) {
            descHtml = '<div class="sess-desc" id="' + descId + '">' + esc(s.topic.description) + '</div>' +
              '<button class="more-btn" id="' + descId + 'b" onclick="toggleDesc(\'' + descId + '\')">More</button>';
          }

          h += '<div class="sess" style="flex-wrap:wrap">' +
            '<div class="sess-info">' +
              '<div class="sess-time">' + fmtTime(start) + (end ? ' to ' + fmtTime(end) : '') + '</div>' +
              (topic ? '<div class="sess-topic">' + esc(topic) + '</div>' : '') +
              descHtml +
              '<div class="sess-meta">' + (lowPlaces ? '<span class="low">' + places + ' place' + (places !== 1 ? 's' : '') + ' left</span>' : places + ' place' + (places !== 1 ? 's' : '') + ' left') + ' \u00b7 \u00a3' + price + ' member price</div>' +
            '</div>' +
            '<div style="flex-shrink:0;margin-left:0.4rem">' + action + '</div>' +
            pointsHtml +
          '</div>';
        });
      }

      return h;
    }

      var booked = trip.isBooked === true;
      var cd = countdown(trip);

      var h = '<div class="trip-hero-wrap">' +
        (trip.imageUrl ? '<img class="trip-hero" src="' + esc(trip.imageUrl) + '" alt="">' : '<div class="trip-hero" style="background:#e0ddd8"></div>') +
        '<button class="back" onclick="showScreen(\'home\')">\u2190 Home</button>' +
      '</div>';

      h += '<h1 style="font-size:1.3rem;margin-bottom:0.3rem">' + esc(trip.title) + '</h1>';

      // Dates and location
      var dateStr = "";
      if (trip.startDate) dateStr = fmtLong(new Date(trip.startDate));
      if (trip.endDate && trip.endDate !== trip.startDate) dateStr += " to " + fmtLong(new Date(trip.endDate));

    function cleanDescription(html) {
      // Strip Wix formatting, keep paragraphs and bullet lists
      var div = document.createElement("div");
      div.innerHTML = html;
      // Remove all style attributes
      div.querySelectorAll("[style]").forEach(function(el) { el.removeAttribute("style"); });
      // Remove all class attributes
      div.querySelectorAll("[class]").forEach(function(el) { el.removeAttribute("class"); });
      // Remove font, span (unwrap), and other formatting tags
      ["font","span","b","strong","i","em","u"].forEach(function(tag) {
        div.querySelectorAll(tag).forEach(function(el) {
          var parent = el.parentNode;
          while (el.firstChild) parent.insertBefore(el.firstChild, el);
          parent.removeChild(el);
        });
      });
      // Clean up: collapse empty paragraphs
      div.querySelectorAll("p").forEach(function(p) {
        if (!p.textContent.trim() && !p.querySelector("img,br")) p.remove();
      });
      return div.innerHTML;
    }

    // --- ALL TRIPS SCREEN ---
    var tripFilter = "all";

    function tripCategory(t) {
      // Simple rule based on title and location keywords.
      // "Golf school" if title contains "golf school" or "school".
      // "Overseas" if location doesn't look like UK.
      // "UK days" for everything else.
      var title = (t.title || "").toLowerCase();
      var loc = (t.location || "").toLowerCase();
      if (title.indexOf("golf school") !== -1 || title.indexOf("school") !== -1) return "school";
      var ukKeywords = ["england","uk","kent","surrey","sussex","essex","london","hampshire","berkshire","hertfordshire","buckinghamshire","bedfordshire","oxfordshire","cambridgeshire","norfolk","suffolk","devon","dorset","somerset","wiltshire","gloucestershire","warwickshire","yorkshire","lancashire","cheshire","nottinghamshire","leicestershire","derbyshire","staffordshire","shropshire","worcestershire","scotland","wales","northern ireland"];
      var isUk = ukKeywords.some(function(k) { return loc.indexOf(k) !== -1; });
      // If no location, check title for country-sounding words
      if (!isUk && loc) {
        // Assume overseas if location doesn't match UK
        return "overseas";
      }
      return "uk";
    }

    async function saveDetails() {
      var btn = document.getElementById("detSaveBtn");
      var msg = document.getElementById("detSaveMsg");
      if (!btn) return;
      btn.textContent = "Saving...";
      btn.disabled = true;
      msg.style.display = "none";

      var fn = (document.getElementById("detFirstName").value || "").trim();
      var ln = (document.getElementById("detLastName").value || "").trim();
      var phone = (document.getElementById("detPhone").value || "").trim();
      var hcp = document.getElementById("detHandicap").value;
      var club = (document.getElementById("detGolfClub").value || "").trim();

      try {
        var res = await fetch("/.netlify/functions/update-member-details", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            firstName: fn,
            lastName: ln,
            phone: phone,
            handicap: hcp === "" ? null : hcp,
            golfClub: club,
          }),
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          var errMsgs = {
            invalid_phone: "Please check the phone number",
            invalid_handicap: "Handicap must be 0 to 54",
          };
          throw new Error(errMsgs[err.error] || "Could not save. Please try again.");
        }

        // Update local data so Home and Account show the new values
        DATA.firstName = fn;
        DATA.lastName = ln;
        DATA.fullName = (fn + (ln ? " " + ln : "")).trim();
        DATA.phone = phone;
        DATA.handicap = hcp === "" ? null : hcp;
        DATA.golfClub = club || null;

        // Clear the cache so next home-data call gets fresh data
        fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ skipCache: true }),
        }).catch(function() {});

        btn.textContent = "Save";
        btn.disabled = false;
        msg.textContent = "Saved";
        msg.style.display = "";
        msg.style.color = "#2e7d32";
        setTimeout(function() { msg.style.display = "none"; }, 2000);
      } catch (e) {
        btn.textContent = "Save";
        btn.disabled = false;
        msg.textContent = e.message || "Could not save";
        msg.style.display = "";
        msg.style.color = "var(--mg-dark)";
      }
    }

      el.disabled = true;
      el.style.opacity = "0.6";
      try {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 9000);
        var body = { action: "set", serviceId: serviceId, sessionStart: sessionStart, pointsAmount: ptsAmount, moneyAmount: moneyAmount };
        var res = await fetch("/.netlify/functions/redeem-points", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body),
          signal: controller.signal,
        });
        clearTimeout(timer);
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || "failed");
        }
        trackEvent("points_redemption_set");
        window.location.href = bookUrl;
      } catch (err) {
        el.textContent = "Could not set up: " + (err.message || "try again");
        el.disabled = false;
        el.style.opacity = "1";
      }
    }
    async function openPortal(el) {
      var eventId = el.getAttribute("data-portal-event");
      var eventName = el.getAttribute("data-portal-name") || "";
      el.textContent = "Opening...";
      el.disabled = true;
      el.style.opacity = "0.6";
      try {
        var res = await fetch("/.netlify/functions/get-portal-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ eventId: eventId, eventName: eventName }),
        });
        var data = await res.json();
        if (data.portalUrl) {
          window.location.href = data.portalUrl;
          return;
        }
        if (data.error === "no_match") {
          el.textContent = "We couldn't find your trip. We'll sort it.";
          el.style.opacity = "1";
          return;
        }
        el.textContent = "Could not open portal. Try again.";
        el.style.opacity = "1"; el.disabled = false;
      } catch (err) {
        el.textContent = "Could not connect. Try again.";
        el.style.opacity = "1"; el.disabled = false;
      }
    }

    function tapWaitlist(el) { el.textContent = "Opening waitlist..."; el.style.background = "#F0D9E6"; el.style.color = "#8A0050"; el.style.borderColor = "#F0D9E6"; el.style.pointerEvents = "none"; trackEvent("waitlist_tapped"); }
    function tapNav(el, text) { if (text) el.textContent = text; el.style.opacity = "0.6"; el.style.pointerEvents = "none"; trackEvent("trip_tapped"); }

    function buildBookingUrl(s) {
      if (USE_DIRECT_CHECKOUT) {
        var q = new URLSearchParams();
        if (s.serviceId) q.set("serviceId", s.serviceId);
        if (s.scheduleId) q.set("scheduleId", s.scheduleId);
        if (s.resourceId) q.set("resourceId", s.resourceId);
        if (s.startDate) q.set("startDate", s.startDate);
        if (s.endDate) q.set("endDate", s.endDate);
        if (s.eventId) q.set("eventId", s.eventId);
        q.set("timezone", s.timeZone || "Europe/London");
        return "https://www.ladieslovegolf.com/app-checkout?" + q.toString();
      }
      var p = new URLSearchParams();
      if (s.serviceId) p.set("bookings_serviceId", s.serviceId);
      if (s.resourceId) p.set("bookings_resourceId", s.resourceId);
      if (s.startDate) p.set("bookings_startDate", s.startDate);
      if (s.endDate) p.set("bookings_endDate", s.endDate);
      p.set("bookings_timezone", s.timeZone || "Europe/London");
      var base = USE_APP_BOOK
        ? "https://www.ladieslovegolf.com/app-book"
        : "https://www.ladieslovegolf.com/booking-form";
      return base + "?" + p.toString();
    }

    function tripUrl(t) { return t.slug ? "https://www.ladieslovegolf.com/event-details/" + t.slug : "#"; }

    function countdown(t) {
      if (!t.startDate) return "";
      var s = new Date(t.startDate);
      var e = t.endDate ? new Date(t.endDate) : s;
      var now = new Date();
      var d = Math.ceil((s - now) / 864e5);
      if (e && now >= s && now <= e) return "Happening now";
      if (d === 0) return "Today";
      if (d === 1) return "Tomorrow";
      return d > 0 ? "In " + d + " days" : "";
    }

    function trackEvent(n) { try { fetch("/.netlify/functions/track", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ pass: PASS, action: "event", event: n }) }); } catch(e) {} }

    function openFeedback() { document.getElementById("feedbackBox").style.display = "block"; }
    function closeFeedback() { document.getElementById("feedbackBox").style.display = "none"; document.getElementById("feedbackText").value = ""; }
    async function sendFeedback() {
      var t = document.getElementById("feedbackText").value.trim();
      if (!t) return;
      try { await fetch("/.netlify/functions/track", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ pass: PASS, action: "feedback", message: t, screen: "home" }) }); closeFeedback(); trackEvent("feedback_sent"); } catch(e) {}
    }

    function timeGreeting() { var h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
    function firstName() { var n = (DATA && DATA.firstName ? DATA.firstName : "").split(" ")[0].trim(); return n ? ", " + esc(n) : ""; }
    function fmtLong(d) {
      if (typeof d === "string") { var p = d.split("T")[0].split("-"); d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2])); }
      return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
    }
    function fmtShort(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    function fmtTime(d) {
      var h, m;
      if (typeof d === "string" && d.indexOf("T") !== -1) {
        var parts = d.split("T")[1].split(":");
        h = parseInt(parts[0], 10); m = parseInt(parts[1], 10);
      } else if (d instanceof Date) { h = d.getHours(); m = d.getMinutes(); }
      else { return "?"; }
      var a = h >= 12 ? "pm" : "am"; if (h > 12) h -= 12; if (h === 0) h = 12;
      return m === 0 ? h + a : h + "." + String(m).padStart(2,"0") + a;
    }
    function sentenceCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ""; }
    function dropThe(s) { return s.replace(/^The\s+/i, ""); }
    function pts(n) { return Number(n).toLocaleString(); }
    function getInitials(name) {
      var parts = (name || "").trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      if (parts.length === 1 && parts[0]) return parts[0][0].toUpperCase();
      return "?";
    }
    function esc(s) { var d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }
  </script>
</body>
</html>
