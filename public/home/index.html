      btn.textContent = "Saving...";
      btn.disabled = true;
      msg.style.display = "none";

      var fn = (document.getElementById("detFirstName").value || "").trim();
      var ln = (document.getElementById("detLastName").value || "").trim();
      var phone = (document.getElementById("detPhone").value || "").trim();
      var hcp = document.getElementById("detHandicap").value;
      var club = (document.getElementById("detGolfClub").value || "").trim();

      try {
        var res = await fetch("/.netlify/functions/update-member-details", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            firstName: fn,
            lastName: ln,
            phone: phone,
            handicap: hcp === "" ? null : hcp,
            golfClub: club,
          }),
        });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          var errMsgs = {
            invalid_phone: "Please check the phone number",
            invalid_handicap: "Handicap must be 0 to 54",
          };
          throw new Error(errMsgs[err.error] || "Could not save. Please try again.");
        }

        // Update local data so Home and Account show the new values
        DATA.firstName = fn;
        DATA.lastName = ln;
        DATA.fullName = (fn + (ln ? " " + ln : "")).trim();
        DATA.phone = phone;
        DATA.handicap = hcp === "" ? null : hcp;
        DATA.golfClub = club || null;

        // Clear the cache so next home-data call gets fresh data
        fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ skipCache: true }),
        }).catch(function() {});

        btn.textContent = "Save";
        btn.disabled = false;
        msg.textContent = "Saved";
        msg.style.display = "";
        msg.style.color = "#2e7d32";
        setTimeout(function() { msg.style.display = "none"; }, 2000);
      } catch (e) {
        btn.textContent = "Save";
        btn.disabled = false;
        msg.textContent = e.message || "Could not save";
        msg.style.display = "";
        msg.style.color = "var(--mg-dark)";
      }
    }

    // --- UTILITIES ---
    function selectDay(i) { selectedDay = i; showScreen("home"); }

    function changeVenue() {
      DATA.homeVenue = null;
      DATA.homeVenueSource = "none";
      selectedDay = -1;
      showScreen("home");
    }

    async function pickVenue(venueId) {
      var venue = (DATA.allVenues || []).find(function(v) { return v.id === venueId; });
      if (!venue) return;
      try {
        await fetch("/.netlify/functions/set-home-venue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ pass: PASS, venueId: venueId }),
        });
      } catch(e) {}
      document.getElementById("homeScreen").innerHTML = '<div class="skel" style="height:200px"></div>';
      try {
        var fetchBody = PASS ? { pass: PASS, skipCache: true } : { skipCache: true };
        var res = await fetch("/.netlify/functions/home-data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(fetchBody),
        });
        if (res.ok) { DATA = await res.json(); selectedDay = -1; showScreen("home"); }
      } catch(e) {}
    }

    function togglePerks() {
      var extra = document.getElementById("perksExtra");
      var btn = document.getElementById("perksToggle");
      if (extra.style.display === "none") { extra.style.display = ""; btn.textContent = "Show fewer"; }
      else { extra.style.display = "none"; btn.textContent = "See all " + DATA.perks.length; }
    }

    function toggleDesc(id) {
      var el = document.getElementById(id);
      var btn = document.getElementById(id + "b");
      el.classList.toggle("open");
      btn.textContent = el.classList.contains("open") ? "Less" : "More";
    }

    function tapBookBtn(el) {
      if (window.showBookLoader) window.showBookLoader();
      el.style.pointerEvents = "none"; trackEvent("book_tapped");
    }

    async function usePoints(serviceId, sessionStart, ptsAmount, moneyAmount, bookUrl, el) {
      if (window.showBookLoader) window.showBookLoader();
      el.disabled = true;
      el.style.opacity = "0.6";
      try {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 9000);
        var body = { action: "set", serviceId: serviceId, sessionStart: sessionStart, pointsAmount: ptsAmount, moneyAmount: moneyAmount };
        var res = await fetch("/.netlify/functions/redeem-points", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(body),
          signal: controller.signal,
        });
        clearTimeout(timer);
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.error || "failed");
        }
        trackEvent("points_redemption_set");
        window.location.href = bookUrl;
      } catch (err) {
        el.textContent = "Could not set up: " + (err.message || "try again");
        el.disabled = false;
        el.style.opacity = "1";
      }
    }
    async function autoOpenPortal() {
      // Find the member's first upcoming booked trip and open its portal
      var trip = (DATA.yourTrips || [])[0];
      if (!trip) {
        // No booked trips: just show Home
        return;
      }
      try {
        var res = await fetch("/.netlify/functions/get-portal-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ eventId: trip.id || "", eventName: trip.title || "" }),
        });
        var data = await res.json();
        var url = data.portalUrl || (data.links && data.links.length > 0 ? data.links[0].portalUrl : null);
        if (url) {
          window.location.href = url;
          return;
        }
      } catch (e) {
        console.error("autoOpenPortal:", e.message);
      }
      // Failed: stay on Home, member can tap the trip manually
    }

    async function openPortal(el) {
      var eventId = el.getAttribute("data-portal-event");
      var eventName = el.getAttribute("data-portal-name") || "";
      el.textContent = "Opening...";
      el.disabled = true;
      el.style.opacity = "0.6";
      try {
        var res = await fetch("/.netlify/functions/get-portal-link", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ eventId: eventId, eventName: eventName }),
        });
        var data = await res.json();
        if (data.portalUrl) {
          window.location.href = data.portalUrl;
          return;
        }
        // Multiple links returned: use the first one
        if (data.links && data.links.length > 0 && data.links[0].portalUrl) {
          window.location.href = data.links[0].portalUrl;
          return;
        }
        if (data.error === "no_match") {
          el.textContent = "We couldn't find your trip. We'll sort it.";
          el.style.opacity = "1";
          return;
        }
        el.textContent = "Could not open portal. Try again.";
        el.style.opacity = "1"; el.disabled = false;
      } catch (err) {
        el.textContent = "Could not connect. Try again.";
        el.style.opacity = "1"; el.disabled = false;
      }
    }

    function tapWaitlist(el) { el.textContent = "Opening waitlist..."; el.style.background = "#F0D9E6"; el.style.color = "#8A0050"; el.style.borderColor = "#F0D9E6"; el.style.pointerEvents = "none"; trackEvent("waitlist_tapped"); }
    function tapNav(el, text) { if (text) el.textContent = text; el.style.opacity = "0.6"; el.style.pointerEvents = "none"; trackEvent("trip_tapped"); }

    function buildBookingUrl(s) {
      if (USE_DIRECT_CHECKOUT) {
        var q = new URLSearchParams();
        if (s.serviceId) q.set("serviceId", s.serviceId);
        if (s.scheduleId) q.set("scheduleId", s.scheduleId);
        if (s.resourceId) q.set("resourceId", s.resourceId);
        if (s.startDate) q.set("startDate", s.startDate);
        if (s.endDate) q.set("endDate", s.endDate);
        if (s.eventId) q.set("eventId", s.eventId);
        q.set("timezone", s.timeZone || "Europe/London");
        return "https://www.ladieslovegolf.com/app-checkout?" + q.toString();
      }
      var p = new URLSearchParams();
      if (s.serviceId) p.set("bookings_serviceId", s.serviceId);
      if (s.resourceId) p.set("bookings_resourceId", s.resourceId);
      if (s.startDate) p.set("bookings_startDate", s.startDate);
      if (s.endDate) p.set("bookings_endDate", s.endDate);
      p.set("bookings_timezone", s.timeZone || "Europe/London");
      var base = USE_APP_BOOK
        ? "https://www.ladieslovegolf.com/app-book"
        : "https://www.ladieslovegolf.com/booking-form";
      return base + "?" + p.toString();
    }

    function tripUrl(t) { return t.slug ? "https://www.ladieslovegolf.com/event-details/" + t.slug : "#"; }

    function countdown(t) {
      if (!t.startDate) return "";
      var s = new Date(t.startDate);
      var e = t.endDate ? new Date(t.endDate) : s;
      var now = new Date();
      var d = Math.ceil((s - now) / 864e5);
      if (e && now >= s && now <= e) return "Happening now";
      if (d === 0) return "Today";
      if (d === 1) return "Tomorrow";
      return d > 0 ? "In " + d + " days" : "";
    }

    function trackEvent(n) { try { fetch("/.netlify/functions/track", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ pass: PASS, action: "event", event: n }) }); } catch(e) {} }

    function openFeedback() { document.getElementById("feedbackBox").style.display = "block"; }
    function closeFeedback() { document.getElementById("feedbackBox").style.display = "none"; document.getElementById("feedbackText").value = ""; }
    async function sendFeedback() {
      var t = document.getElementById("feedbackText").value.trim();
      if (!t) return;
      try { await fetch("/.netlify/functions/track", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ pass: PASS, action: "feedback", message: t, screen: "home" }) }); closeFeedback(); trackEvent("feedback_sent"); } catch(e) {}
    }

    // === VIDEO CARDS ON HOME ===
    // Wix runs the video library and programmes. We show:
    // - "This week's tip" card (admin-set, Supabase video_tip table)
    // - "Videos" link card opening Wix Video page
    // - For non-video members: free Beginner channel card instead of tip

    var WIX_VIDEO_URL = "https://www.ladieslovegolf.com/video";
    var WIX_BEGINNER_URL = "https://www.ladieslovegolf.com/video";
    var PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

    function hasVideoAccess() {
      return DATA && DATA.plan && DATA.plan.hasVideoAccess === true;
    }

    function loadHomeVideoCard() {
      var container = document.getElementById("homeVideoCard");
      if (!container) return;
      fetch("/.netlify/functions/video-tip", { credentials: "same-origin" })
        .then(function(r) { return r.ok ? r.json() : { tip: null }; })
        .then(function(data) {
          var tip = data.tip;
          var access = hasVideoAccess();
          var h = "";

          // This week's tip (for video members, if admin has set one)
          if (access && tip && tip.video_url && tip.title) {
            h += '<a href="' + esc(tip.video_url) + '" style="display:block;text-decoration:none" data-action="tap-nav">' +
              '<div class="vid-featured" style="margin-bottom:0.75rem">' +
                (tip.thumbnail_url ? '<img src="' + esc(tip.thumbnail_url) + '" alt="" style="height:160px">' : '<div style="height:160px;background:var(--charcoal)"></div>') +
                '<div class="vid-featured-overlay">' +
                  '<div class="vid-featured-label">This week\'s tip</div>' +
                  '<div class="vid-featured-title">' + esc(tip.title) + '</div>' +
                '</div>' +
                '<div class="vid-play-btn">' + PLAY_SVG + '</div>' +
              '</div>' +
            '</a>';
          }

          // "Videos" link card (all members)
          h += '<a href="' + WIX_VIDEO_URL + '" style="display:block;text-decoration:none" data-action="tap-nav">' +
            '<div class="card" style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">' +
              '<div style="width:44px;height:44px;border-radius:12px;background:var(--charcoal);display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
                '<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M8 5v14l11-7z"/></svg>' +
              '</div>' +
              '<div>' +
                '<div style="font-weight:700;font-size:0.95rem">Videos</div>' +
                '<div class="small">' + (access ? 'Your coaching library' : 'Browse coaching videos') + '</div>' +
              '</div>' +
              '<span class="mg" style="margin-left:auto;font-size:0.85rem">\u203a</span>' +
            '</div>' +
          '</a>';

          container.innerHTML = h;
        })
        .catch(function() {});
    }

    function tile(label, sub, action) {
      // action: "card", "allTrips", "account" = data-screen; "scroll-book" = scroll; "wix-*" = external link
      var wixUrls = {
        "wix-video": "https://www.ladieslovegolf.com/video",
        "wix-programme": "https://www.ladieslovegolf.com/online-programs",
        "wix-community": "https://www.ladieslovegolf.com/forum",
        "wix-memberships": "https://www.ladieslovegolf.com/plans-pricing",
        "wix-rejoin": DATA.planCheckoutUrls && DATA.planCheckoutUrls.physical || "https://www.ladieslovegolf.com/plans-pricing",
      };
      if (wixUrls[action]) {
        return '<a class="tile" href="' + esc(wixUrls[action]) + '" style="text-decoration:none">' +
          '<div class="tile-label">' + esc(label) + '</div>' +
          '<div class="tile-sub">' + esc(sub) + '</div>' +
        '</a>';
      }
      if (action === "scroll-book") {
        return '<div class="tile" data-action="scroll-book">' +
          '<div class="tile-label">' + esc(label) + '</div>' +
          '<div class="tile-sub">' + esc(sub) + '</div>' +
        '</div>';
      }
      return '<div class="tile" data-screen="' + esc(action) + '">' +
        '<div class="tile-label">' + esc(label) + '</div>' +
        '<div class="tile-sub">' + esc(sub) + '</div>' +
      '</div>';
    }

    function fmtDayWord(dateStr) {
      if (!dateStr) return "";
      var d;
      if (typeof dateStr === "string" && dateStr.indexOf("T") !== -1) {
        var parts = dateStr.split("T")[0].split("-");
        d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      } else { d = new Date(dateStr); }
      var now = new Date(); now.setHours(0,0,0,0);
      var target = new Date(d); target.setHours(0,0,0,0);
      var diff = Math.round((target - now) / 864e5);
      if (diff === 0) return "Today";
      if (diff === 1) return "Tomorrow";
      return d.toLocaleDateString("en-GB", { weekday: "long" });
    }

    function timeGreeting() { var h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; }
    function firstName() { var n = (DATA && DATA.firstName ? DATA.firstName : "").split(" ")[0].trim(); return n ? ", " + esc(n) : ""; }
    function fmtLong(d) {
      if (typeof d === "string") { var p = d.split("T")[0].split("-"); d = new Date(parseInt(p[0]), parseInt(p[1]) - 1, parseInt(p[2])); }
      return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
    }
    function fmtShort(d) { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
    function fmtTime(d) {
      var h, m;
      if (typeof d === "string" && d.indexOf("T") !== -1) {
        var parts = d.split("T")[1].split(":");
        h = parseInt(parts[0], 10); m = parseInt(parts[1], 10);
      } else if (d instanceof Date) { h = d.getHours(); m = d.getMinutes(); }
      else { return "?"; }
      var a = h >= 12 ? "pm" : "am"; if (h > 12) h -= 12; if (h === 0) h = 12;
      return m === 0 ? h + a : h + "." + String(m).padStart(2,"0") + a;
    }
    function sentenceCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : ""; }
    function dropThe(s) { return s.replace(/^The\s+/i, ""); }
    function pts(n) { return Number(n).toLocaleString(); }
    function getInitials(name) {
      var parts = (name || "").trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      if (parts.length === 1 && parts[0]) return parts[0][0].toUpperCase();
      return "?";
    }
    function esc(s) { var d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }
  </script>
