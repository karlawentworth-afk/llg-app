<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLG Admin - Monthly Posters</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    .header { background: #2B2A29; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.3rem; font-weight: 600; }
    .header a { color: #DE0082; text-decoration: none; font-size: 0.9rem; }
    .toolbar { background: #fff; border-bottom: 1px solid #ddd; padding: 1rem 2rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    select { font-size: 1rem; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; min-width: 200px; }
    button { font-size: 0.95rem; padding: 0.5rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #DE0082; color: #fff; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .main { padding: 1.5rem 2rem; max-width: 1200px; }
    .status { padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; font-weight: 600; }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-err { background: #fce4ec; color: #c62828; }
    .status-warn { background: #fff3e0; color: #e65100; }
    .status-info { background: #e3f2fd; color: #1565c0; }
    .downloads { display: flex; gap: 0.75rem; flex-wrap: wrap; margin: 1rem 0; }
    .downloads button { min-width: 180px; }
    .preview-wrap { background: #666; padding: 2rem; border-radius: 8px; display: inline-block; }
    .login-gate { max-width: 400px; margin: 4rem auto; background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .login-gate h1 { margin-bottom: 1rem; }

    /* Poster styles */
    .poster {
      width: 794px; /* A4 at 96dpi */
      min-height: 1123px;
      background: #2B2A29;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      padding: 48px 40px;
      position: relative;
    }
    .poster-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .poster-logo { height: 56px; }
    .poster-venue-logo { max-height: 80px; max-width: 160px; object-fit: contain; background: #fff; border-radius: 10px; padding: 8px; }
    .poster-title { font-size: 28px; font-weight: 800; letter-spacing: 1px; line-height: 1.2; margin-bottom: 4px; }
    .poster-month { font-size: 32px; font-weight: 800; color: #DE0082; margin-bottom: 24px; }
    .poster-row { display: flex; gap: 20px; padding: 16px 0; border-bottom: 1px solid #DE0082; }
    .poster-row:last-child { border-bottom: none; }
    .poster-date { flex-shrink: 0; width: 60px; text-align: center; }
    .poster-date-num { font-size: 36px; font-weight: 800; color: #DE0082; line-height: 1; }
    .poster-date-day { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
    .poster-content { flex: 1; }
    .poster-time { font-size: 14px; font-weight: 400; color: #ccc; margin-bottom: 2px; }
    .poster-topic { font-size: 17px; font-weight: 700; line-height: 1.3; }
    .poster-desc { font-size: 13px; font-weight: 400; color: #ccc; line-height: 1.5; margin-top: 4px; }
    .poster-footnote { margin-top: 24px; font-size: 12px; color: #aaa; font-style: italic; }
    [contenteditable]:hover { outline: 1px dashed rgba(222,0,130,0.4); outline-offset: 2px; cursor: text; }
    [contenteditable]:focus { outline: 1px solid #DE0082; outline-offset: 2px; }
    .poster-two-col { column-count: 2; column-gap: 32px; }
    .poster-row { break-inside: avoid; -webkit-column-break-inside: avoid; }
  </style>
</head>
<body>

<div id="loginGate" class="login-gate">
  <h1>Monthly Posters</h1>
  <p id="loginMsg">Checking access...</p>
  <div id="passwordFallback" style="display:none;margin-top:1rem">
    <label>Admin password</label>
    <input type="password" id="passwordInput" placeholder="Enter password" style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:6px;margin-bottom:0.5rem;font-size:1rem">
    <button class="btn-primary" id="pwdLoginBtn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <h1>Monthly Posters</h1>
    <a href="/admin/planner.html">Planner</a>
    <a href="/admin/">Upload topics</a>
  </div>

  <div class="toolbar">
    <select id="venueSelect"><option value="">Choose venue</option></select>
    <select id="monthSelect"></select>
    <button class="btn-primary" id="generateBtn">Generate poster</button>
  </div>

  <div class="main">
    <div id="statusBar" style="display:none"></div>
    <div id="warnings"></div>
    <div class="downloads" id="downloads" style="display:none">
      <button class="btn-primary" id="dlPdf">Download A4 PDF</button>
      <button class="btn-primary" id="dlSocial">Download social 1080x1350</button>
      <button class="btn-primary" id="dlStory">Download story 1080x1920</button>
    </div>
    <div id="previewArea"></div>
  </div>
</div>

<!-- Hidden poster render target -->
<div id="posterRender" style="position:absolute;left:-9999px;top:0"></div>

<script>
  var PASSWORD = "";
  try { PASSWORD = sessionStorage.getItem("llg_admin_pwd") || ""; } catch(e) {}
  var VENUES = [];
  var POSTER_DATA = null;

  // Auth
  (async function() {
    try {
      var res = await api({ action: "venues" });
      enterApp(res);
      return;
    } catch(e) {}
    if (PASSWORD) {
      try {
        var res2 = await apiWithPwd({ action: "venues" });
        enterApp(res2);
        return;
      } catch(e) {}
      PASSWORD = "";
      try { sessionStorage.removeItem("llg_admin_pwd"); } catch(e) {}
    }
    document.getElementById("loginMsg").textContent = "";
    document.getElementById("passwordFallback").style.display = "";
  })();

  document.getElementById("pwdLoginBtn").addEventListener("click", async function() {
    PASSWORD = document.getElementById("passwordInput").value;
    if (!PASSWORD) return;
    try {
      var res = await apiWithPwd({ action: "venues" });
      try { sessionStorage.setItem("llg_admin_pwd", PASSWORD); } catch(e) {}
      enterApp(res);
    } catch(e) {
      document.getElementById("loginMsg").textContent = "Wrong password.";
    }
  });

  function enterApp(data) {
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("app").style.display = "block";
    VENUES = data.venues || [];
    var sel = document.getElementById("venueSelect");
    VENUES.forEach(function(v) {
      var opt = document.createElement("option");
      opt.value = v.id;
      opt.textContent = v.name + (v.town ? " (" + v.town + ")" : "");
      sel.appendChild(opt);
    });
    populateMonths();
  }

  function populateMonths() {
    var sel = document.getElementById("monthSelect");
    var now = new Date();
    for (var i = -1; i < 6; i++) {
      var d = new Date(now.getFullYear(), now.getMonth() + i, 1);
      var opt = document.createElement("option");
      opt.value = d.getFullYear() + "-" + (d.getMonth() + 1);
      opt.textContent = d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
      if (i === 0) opt.selected = true;
      sel.appendChild(opt);
    }
  }

  async function api(body) {
    var hdrs = { "Content-Type": "application/json" };
    if (PASSWORD) hdrs["X-Admin-Password"] = PASSWORD;
    var res = await fetch("/.netlify/functions/planner", {
      method: "POST", headers: hdrs, credentials: "same-origin",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }

  async function apiWithPwd(body) {
    var res = await fetch("/.netlify/functions/planner", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": PASSWORD },
      credentials: "same-origin",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }

  // Generate
  document.getElementById("generateBtn").addEventListener("click", generate);

  async function generate() {
    var venueId = document.getElementById("venueSelect").value;
    var monthVal = document.getElementById("monthSelect").value;
    if (!venueId || !monthVal) { showStatus("Choose a venue and month", "err"); return; }

    var parts = monthVal.split("-").map(Number);
    var year = parts[0], month = parts[1];
    var venue = VENUES.find(function(v) { return v.id === venueId; });

    showStatus("Loading sessions...", "info");
    document.getElementById("downloads").style.display = "none";
    document.getElementById("previewArea").innerHTML = "";
    document.getElementById("warnings").innerHTML = "";

    try {
      var data = await api({ action: "sessions", venueId: venueId, year: year, month: month });
      var sessions = data.sessions || [];

      // Warn about missing topics
      var noTopic = sessions.filter(function(s) {
        return !s.currentTopic || !s.currentTopic.title || s.currentTopic.title === "No session this day";
      });
      var realNoTopic = sessions.filter(function(s) { return !s.currentTopic; });
      if (realNoTopic.length > 0) {
        var warnHtml = '<div class="status status-warn">' + realNoTopic.length + ' session(s) have no topic assigned:<ul>';
        realNoTopic.forEach(function(s) {
          warnHtml += '<li>' + formatDateStr(s.startDate) + ' ' + formatTimeStr(s.startDate) + '</li>';
        });
        warnHtml += '</ul></div>';
        document.getElementById("warnings").innerHTML = warnHtml;
      }

      // Filter to sessions with real topics (not "No session this day")
      var posterSessions = sessions.filter(function(s) {
        return s.currentTopic && s.currentTopic.title && s.currentTopic.title !== "No session this day";
      });

      // Group by date, merge same topic on same day
      var grouped = groupSessions(posterSessions);

      POSTER_DATA = {
        venue: venue,
        year: year,
        month: month,
        monthName: new Date(year, month - 1, 1).toLocaleDateString("en-GB", { month: "long" }),
        rows: grouped,
      };

      renderPosterPreview();
      document.getElementById("downloads").style.display = "flex";
      document.getElementById("statusBar").style.display = "none";
    } catch(e) {
      showStatus("Failed: " + e.message, "err");
    }
  }

  function groupSessions(sessions) {
    var byDate = {};
    sessions.forEach(function(s) {
      var dateKey = s.startDate ? s.startDate.split("T")[0] : "";
      if (!dateKey) return;
      if (!byDate[dateKey]) byDate[dateKey] = {};
      var topicKey = (s.currentTopic.title || "").toLowerCase();
      if (!byDate[dateKey][topicKey]) {
        byDate[dateKey][topicKey] = {
          date: dateKey,
          title: s.currentTopic.title,
          description: s.currentTopic.description || "",
          shortDescription: s.currentTopic.shortDescription || null,
          times: [],
        };
      }
      byDate[dateKey][topicKey].times.push({
        start: s.startDate,
        end: s.endDate,
      });
    });

    var rows = [];
    Object.keys(byDate).sort().forEach(function(dateKey) {
      Object.keys(byDate[dateKey]).forEach(function(topicKey) {
        rows.push(byDate[dateKey][topicKey]);
      });
    });
    return rows;
  }

  function renderPosterPreview() {
    if (!POSTER_DATA) return;
    var d = POSTER_DATA;
    var useTwoCol = d.rows.length > 8;

    var html = '<div class="poster" id="posterCanvas">';
    html += '<div class="poster-header">';
    html += '<img class="poster-logo" src="/home/LLG_Logo_White.svg" alt="LLG">';
    if (d.venue.logo_url) {
      html += '<img class="poster-venue-logo" src="' + esc(d.venue.logo_url) + '" alt="">';
    }
    html += '</div>';
    html += '<div class="poster-title" contenteditable="true">MONTHLY GROUP<br>COACHING SCHEDULE</div>';
    html += '<div class="poster-month" contenteditable="true">' + d.monthName.toUpperCase() + ' ' + d.year + '</div>';

    if (useTwoCol) html += '<div class="poster-two-col">';

    d.rows.forEach(function(row) {
      var dateParts = row.date.split("-");
      var dateObj = new Date(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
      var dayNum = dateObj.getDate();
      var dayName = dateObj.toLocaleDateString("en-GB", { weekday: "short" }).toUpperCase();

      var timeStr = row.times.map(function(t) {
        return formatTimeStr(t.start).toUpperCase();
      }).join(" & ");

      html += '<div class="poster-row">';
      html += '<div class="poster-date"><div class="poster-date-num">' + dayNum + '</div><div class="poster-date-day">' + dayName + '</div></div>';
      html += '<div class="poster-content">';
      html += '<div class="poster-time" contenteditable="true">' + esc(timeStr) + '</div>';
      html += '<div class="poster-topic" contenteditable="true">' + esc(row.title) + '</div>';
      var posterDesc = row.shortDescription || (row.description ? row.description.split('.').slice(0, 2).join('.').trim() + '.' : "");
      if (posterDesc) html += '<div class="poster-desc" contenteditable="true">' + esc(posterDesc) + '</div>';
      html += '</div></div>';
    });

    if (useTwoCol) html += '</div>';

    if (d.venue.poster_footnote) {
      html += '<div class="poster-footnote" contenteditable="true">' + esc(d.venue.poster_footnote) + '</div>';
    }

    html += '</div>';

    document.getElementById("previewArea").innerHTML = '<p style="margin-bottom:0.75rem;font-size:0.9rem;color:#666">Click any text on the poster to edit it before downloading.</p><div class="preview-wrap">' + html + '</div>';
  }

  // Downloads
  document.getElementById("dlPdf").addEventListener("click", async function() {
    this.textContent = "Generating..."; this.disabled = true;
    try { await downloadPdf(); } catch(e) { showStatus("PDF failed: " + e.message, "err"); }
    this.textContent = "Download A4 PDF"; this.disabled = false;
  });

  document.getElementById("dlSocial").addEventListener("click", async function() {
    this.textContent = "Generating..."; this.disabled = true;
    try { await downloadImage(1080, 1350, "social"); } catch(e) { showStatus("Image failed: " + e.message, "err"); }
    this.textContent = "Download social 1080x1350"; this.disabled = false;
  });

  document.getElementById("dlStory").addEventListener("click", async function() {
    this.textContent = "Generating..."; this.disabled = true;
    try { await downloadImage(1080, 1920, "story"); } catch(e) { showStatus("Image failed: " + e.message, "err"); }
    this.textContent = "Download story 1080x1920"; this.disabled = false;
  });

  async function downloadPdf() {
    var el = document.getElementById("posterCanvas");
    if (!el) return;
    var canvas = await html2canvas(el, { scale: 2, backgroundColor: "#2B2A29", useCORS: true });
    var imgData = canvas.toDataURL("image/png");
    var pdf = new jspdf.jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    var w = pdf.internal.pageSize.getWidth();
    var h = pdf.internal.pageSize.getHeight();
    pdf.addImage(imgData, "PNG", 0, 0, w, h);
    var filename = "LLG-" + esc(POSTER_DATA.venue.name).replace(/\s+/g, "-") + "-" + POSTER_DATA.monthName + "-" + POSTER_DATA.year + ".pdf";
    pdf.save(filename);
  }

  async function downloadImage(targetW, targetH, suffix) {
    var el = document.getElementById("posterCanvas");
    if (!el) return;

    // Resize poster for the target aspect ratio
    var origW = el.style.width;
    var origH = el.style.minHeight;
    el.style.width = targetW + "px";
    el.style.minHeight = targetH + "px";

    var canvas = await html2canvas(el, { scale: 1, backgroundColor: "#2B2A29", useCORS: true, width: targetW, height: targetH });

    // Restore
    el.style.width = origW;
    el.style.minHeight = origH;

    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "LLG-" + POSTER_DATA.venue.name.replace(/\s+/g, "-") + "-" + POSTER_DATA.monthName + "-" + POSTER_DATA.year + "-" + suffix + ".png";
      a.click();
      URL.revokeObjectURL(url);
    }, "image/png");
  }

  // Helpers
  function showStatus(msg, type) {
    var el = document.getElementById("statusBar");
    el.className = "status status-" + type;
    el.textContent = msg;
    el.style.display = "block";
    if (type === "ok") setTimeout(function() { el.style.display = "none"; }, 3000);
  }

  function formatTimeStr(dateStr) {
    if (!dateStr || dateStr.indexOf("T") === -1) return "?";
    var parts = dateStr.split("T")[1].split(":");
    var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
    var ampm = h >= 12 ? "PM" : "AM";
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    return m === 0 ? h + ":" + "00 " + ampm : h + ":" + String(m).padStart(2, "0") + " " + ampm;
  }

  function formatDateStr(dateStr) {
    if (!dateStr) return "?";
    var parts = dateStr.split("T")[0].split("-");
    var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = String(s || "");
    return d.innerHTML;
  }
</script>
</body>
</html>
