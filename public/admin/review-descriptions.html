<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLG Admin - Topic Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    .header { background: #2B2A29; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.3rem; font-weight: 600; }
    .header a { color: #DE0082; text-decoration: none; font-size: 0.9rem; }
    .main { padding: 1.5rem 2rem; max-width: 1000px; }
    .status { padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; font-weight: 600; }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-err { background: #fce4ec; color: #c62828; }
    .status-info { background: #e3f2fd; color: #1565c0; }
    button { font-size: 0.95rem; padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #DE0082; color: #fff; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-small { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
    input, textarea { font-size: 0.95rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; width: 100%; }
    textarea { resize: vertical; min-height: 50px; }
    .topic-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .topic-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.4rem; }
    .topic-full { font-size: 0.85rem; color: #555; margin-bottom: 0.5rem; line-height: 1.4; }
    .topic-row { display: flex; gap: 0.5rem; align-items: flex-start; margin-bottom: 0.4rem; }
    .topic-row label { font-weight: 600; font-size: 0.8rem; min-width: 80px; padding-top: 0.5rem; flex-shrink: 0; }
    .topic-row textarea, .topic-row input { flex: 1; }
    .toolbar { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .search-box { padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; min-width: 250px; }
    .login-gate { max-width: 400px; margin: 4rem auto; background: #fff; padding: 2rem; border-radius: 12px; }
    .login-gate h1 { margin-bottom: 1rem; }
    .add-form { background: #fff; border: 2px solid #DE0082; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .add-form h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body>

<div id="loginGate" class="login-gate">
  <h1>Topic Library</h1>
  <p id="loginMsg">Checking access...</p>
  <div id="passwordFallback" style="display:none;margin-top:1rem">
    <label>Admin password</label>
    <input type="password" id="passwordInput" placeholder="Enter password" style="margin-bottom:0.5rem">
    <button class="btn-primary" id="pwdLoginBtn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <h1>Topic Library</h1>
    <a href="/admin/planner.html">Planner</a>
    <a href="/admin/posters.html">Posters</a>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="Search topics...">
    <button class="btn-primary" id="showAddBtn">+ New topic</button>
    <span id="countInfo" style="font-size:0.9rem;color:#666"></span>
  </div>

  <div class="main">
    <div id="statusBar" style="display:none"></div>

    <div id="addForm" class="add-form" style="display:none">
      <h2>Add new topic</h2>
      <div class="topic-row"><label>Title</label><input type="text" id="newTitle"></div>
      <div class="topic-row"><label>Full desc</label><textarea id="newDesc" rows="3"></textarea></div>
      <div class="topic-row"><label>Short desc</label><textarea id="newShort" rows="2" placeholder="Max 25 words, for posters"></textarea></div>
      <div class="topic-row"><label>Category</label><input type="text" id="newCategory" placeholder="Optional"></div>
      <div style="margin-top:0.5rem;display:flex;gap:0.5rem">
        <button class="btn-primary" id="addTopicBtn">Add topic</button>
        <button class="btn-secondary" id="cancelAddBtn">Cancel</button>
      </div>
    </div>

    <div id="topicList"></div>
  </div>
</div>

<script>
  var PASSWORD = "";
  try { PASSWORD = sessionStorage.getItem("llg_admin_pwd") || ""; } catch(e) {}
  var TOPICS = [];
  var searchTimer = null;

  // Auth
  (async function() {
    try { enterApp(await api({ action: "listTopicsForReview" })); return; } catch(e) {}
    if (PASSWORD) {
      try { enterApp(await apiPwd({ action: "listTopicsForReview" })); return; } catch(e) {}
      PASSWORD = "";
    }
    document.getElementById("loginMsg").textContent = "";
    document.getElementById("passwordFallback").style.display = "";
  })();

  document.getElementById("pwdLoginBtn").addEventListener("click", async function() {
    PASSWORD = document.getElementById("passwordInput").value;
    if (!PASSWORD) return;
    try {
      var data = await apiPwd({ action: "listTopicsForReview" });
      try { sessionStorage.setItem("llg_admin_pwd", PASSWORD); } catch(e) {}
      enterApp(data);
    } catch(e) { document.getElementById("loginMsg").textContent = "Wrong password."; }
  });

  function enterApp(data) {
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("app").style.display = "block";
    TOPICS = data.topics || [];
    render();
  }

  async function api(body) {
    var hdrs = { "Content-Type": "application/json" };
    if (PASSWORD) hdrs["X-Admin-Password"] = PASSWORD;
    var res = await fetch("/.netlify/functions/planner", { method: "POST", headers: hdrs, credentials: "same-origin", body: JSON.stringify(body) });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }
  async function apiPwd(body) {
    var res = await fetch("/.netlify/functions/planner", { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Password": PASSWORD }, credentials: "same-origin", body: JSON.stringify(body) });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }

  // Search
  document.getElementById("searchBox").addEventListener("input", function() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 200);
  });

  // Add topic
  document.getElementById("showAddBtn").addEventListener("click", function() {
    document.getElementById("addForm").style.display = "";
    document.getElementById("newTitle").focus();
  });
  document.getElementById("cancelAddBtn").addEventListener("click", function() {
    document.getElementById("addForm").style.display = "none";
  });
  document.getElementById("addTopicBtn").addEventListener("click", async function() {
    var title = document.getElementById("newTitle").value.trim();
    var desc = document.getElementById("newDesc").value.trim();
    var short = document.getElementById("newShort").value.trim();
    var cat = document.getElementById("newCategory").value.trim();
    if (!title) { showStatus("Title is required", "err"); return; }
    try {
      var result = await api({ action: "addLibraryTopic", title: title, description: desc, category: cat });
      if (short) {
        await api({ action: "updateShortDescription", topicId: result.topic.id, shortDescription: short, status: "approved" });
      }
      showStatus("Added: " + title, "ok");
      document.getElementById("addForm").style.display = "none";
      document.getElementById("newTitle").value = "";
      document.getElementById("newDesc").value = "";
      document.getElementById("newShort").value = "";
      document.getElementById("newCategory").value = "";
      // Reload
      var data = await api({ action: "listTopicsForReview" });
      TOPICS = data.topics || [];
      render();
    } catch(e) { showStatus("Failed to add: " + e.message, "err"); }
  });

  function render() {
    var query = (document.getElementById("searchBox").value || "").toLowerCase().trim();
    var filtered = TOPICS;
    if (query) {
      filtered = TOPICS.filter(function(t) { return (t.title || "").toLowerCase().indexOf(query) !== -1; });
    }

    document.getElementById("countInfo").textContent = filtered.length + " of " + TOPICS.length + " topics";

    var html = "";
    filtered.forEach(function(t) {
      html += '<div class="topic-card">' +
        '<div class="topic-title">' + esc(t.title) + '</div>' +
        '<div class="topic-full">' + esc(t.description || "(no full description)") + '</div>' +
        '<div class="topic-row"><label>Short</label><textarea data-id="' + t.id + '" data-field="short">' + esc(t.short_description || "") + '</textarea></div>' +
        '<div class="topic-row"><label>Full</label><textarea data-id="' + t.id + '" data-field="desc" rows="3">' + esc(t.description || "") + '</textarea></div>' +
        '<div style="display:flex;gap:0.5rem;margin-top:0.4rem">' +
          '<button class="btn-small btn-primary" data-save="' + t.id + '">Save</button>' +
          '<button class="btn-small btn-secondary" data-hide="' + t.id + '">Hide from library</button>' +
        '</div>' +
      '</div>';
    });

    document.getElementById("topicList").innerHTML = html;

    // Wire save buttons
    document.querySelectorAll("[data-save]").forEach(function(btn) {
      btn.addEventListener("click", function() { saveTopic(btn.getAttribute("data-save")); });
    });
    document.querySelectorAll("[data-hide]").forEach(function(btn) {
      btn.addEventListener("click", function() { hideTopic(btn.getAttribute("data-hide")); });
    });
  }

  async function saveTopic(id) {
    var shortEl = document.querySelector('textarea[data-id="' + id + '"][data-field="short"]');
    var descEl = document.querySelector('textarea[data-id="' + id + '"][data-field="desc"]');
    var short = shortEl ? shortEl.value.trim() : "";
    var desc = descEl ? descEl.value.trim() : "";

    try {
      // Save short description
      await api({ action: "updateShortDescription", topicId: id, shortDescription: short, status: short ? "approved" : "draft" });
      // Save full description
      await api({ action: "editLibraryTopic", topicId: id, description: desc });
      // Update local
      var t = TOPICS.find(function(t) { return t.id === id; });
      if (t) { t.short_description = short; t.short_description_status = short ? "approved" : "draft"; t.description = desc; }
      showStatus("Saved", "ok");
    } catch(e) { showStatus("Save failed", "err"); }
  }

  async function hideTopic(id) {
    var t = TOPICS.find(function(t) { return t.id === id; });
    if (!confirm("Hide \"" + (t ? t.title : "") + "\" from the library? Past assignments are kept.")) return;
    try {
      await api({ action: "removeLibraryTopic", topicId: id });
      TOPICS = TOPICS.filter(function(t) { return t.id !== id; });
      render();
      showStatus("Hidden", "ok");
    } catch(e) { showStatus("Hide failed", "err"); }
  }

  function showStatus(msg, type) {
    var el = document.getElementById("statusBar");
    el.className = "status status-" + type;
    el.textContent = msg;
    el.style.display = "block";
    if (type === "ok") setTimeout(function() { el.style.display = "none"; }, 2000);
  }

  function esc(s) { var d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }
</script>
</body>
</html>
