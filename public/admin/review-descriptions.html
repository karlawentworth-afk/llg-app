<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLG Admin - Review Short Descriptions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    .header { background: #2B2A29; color: #fff; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.3rem; font-weight: 600; }
    .header a { color: #DE0082; text-decoration: none; font-size: 0.9rem; }
    .main { padding: 1.5rem 2rem; max-width: 1000px; }
    .status { padding: 0.75rem; margin-bottom: 1rem; border-radius: 6px; font-weight: 600; }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-err { background: #fce4ec; color: #c62828; }
    .status-info { background: #e3f2fd; color: #1565c0; }
    button { font-size: 0.95rem; padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #DE0082; color: #fff; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-small { padding: 0.35rem 0.7rem; font-size: 0.85rem; }
    .topic-card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .topic-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .topic-full { font-size: 0.9rem; color: #555; margin-bottom: 0.75rem; line-height: 1.5; }
    .topic-short { font-size: 0.95rem; margin-bottom: 0.5rem; }
    .topic-short textarea { width: 100%; font-size: 0.95rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; resize: vertical; min-height: 50px; }
    .topic-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .badge { padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .badge-draft { background: #fff3e0; color: #e65100; }
    .badge-approved { background: #e8f5e9; color: #2e7d32; }
    .toolbar { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 1rem; align-items: center; }
    .login-gate { max-width: 400px; margin: 4rem auto; background: #fff; padding: 2rem; border-radius: 12px; }
    .login-gate h1 { margin-bottom: 1rem; }
  </style>
</head>
<body>

<div id="loginGate" class="login-gate">
  <h1>Review Descriptions</h1>
  <p id="loginMsg">Checking access...</p>
  <div id="passwordFallback" style="display:none;margin-top:1rem">
    <label>Admin password</label>
    <input type="password" id="passwordInput" placeholder="Enter password" style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:6px;margin-bottom:0.5rem;font-size:1rem">
    <button class="btn-primary" id="pwdLoginBtn">Sign in</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="header">
    <h1>Review Short Descriptions</h1>
    <a href="/admin/planner.html">Planner</a>
    <a href="/admin/posters.html">Posters</a>
  </div>

  <div class="toolbar">
    <button class="btn-primary" id="approveAllBtn">Approve all on this page</button>
    <span id="countInfo" style="font-size:0.9rem;color:#666"></span>
  </div>

  <div class="main">
    <div id="statusBar" style="display:none"></div>
    <div id="topicList"></div>
  </div>
</div>

<script>
  var PASSWORD = "";
  try { PASSWORD = sessionStorage.getItem("llg_admin_pwd") || ""; } catch(e) {}
  var TOPICS = [];

  // Auth (same pattern as other admin pages)
  (async function() {
    try {
      var data = await api({ action: "listTopicsForReview" });
      enterApp(data);
      return;
    } catch(e) {}
    if (PASSWORD) {
      try {
        var data = await apiPwd({ action: "listTopicsForReview" });
        enterApp(data);
        return;
      } catch(e) {}
      PASSWORD = "";
    }
    document.getElementById("loginMsg").textContent = "";
    document.getElementById("passwordFallback").style.display = "";
  })();

  document.getElementById("pwdLoginBtn").addEventListener("click", async function() {
    PASSWORD = document.getElementById("passwordInput").value;
    if (!PASSWORD) return;
    try {
      var data = await apiPwd({ action: "listTopicsForReview" });
      try { sessionStorage.setItem("llg_admin_pwd", PASSWORD); } catch(e) {}
      enterApp(data);
    } catch(e) {
      document.getElementById("loginMsg").textContent = "Wrong password.";
    }
  });

  function enterApp(data) {
    document.getElementById("loginGate").style.display = "none";
    document.getElementById("app").style.display = "block";
    TOPICS = data.topics || [];
    render();
  }

  async function api(body) {
    var hdrs = { "Content-Type": "application/json" };
    if (PASSWORD) hdrs["X-Admin-Password"] = PASSWORD;
    var res = await fetch("/.netlify/functions/planner", {
      method: "POST", headers: hdrs, credentials: "same-origin",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }
  async function apiPwd(body) {
    var res = await fetch("/.netlify/functions/planner", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": PASSWORD },
      credentials: "same-origin",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("api_error");
    return await res.json();
  }

  function render() {
    var approved = TOPICS.filter(function(t) { return t.short_description_status === "approved"; }).length;
    var drafts = TOPICS.filter(function(t) { return t.short_description && t.short_description_status === "draft"; }).length;
    var empty = TOPICS.filter(function(t) { return !t.short_description; }).length;
    document.getElementById("countInfo").textContent = TOPICS.length + " topics: " + approved + " approved, " + drafts + " drafts, " + empty + " empty";

    var html = "";
    TOPICS.forEach(function(t, i) {
      var statusBadge = t.short_description_status === "approved"
        ? '<span class="badge badge-approved">Approved</span>'
        : (t.short_description ? '<span class="badge badge-draft">Draft</span>' : '<span class="badge badge-draft">Empty</span>');

      html += '<div class="topic-card" data-idx="' + i + '">' +
        '<div class="topic-title">' + esc(t.title) + ' ' + statusBadge + '</div>' +
        '<div class="topic-full"><strong>Full:</strong> ' + esc(t.description || "(no full description)") + '</div>' +
        '<div class="topic-short">' +
          '<label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.25rem">Short (for posters, max 25 words):</label>' +
          '<textarea data-topic-id="' + t.id + '" data-field="short">' + esc(t.short_description || "") + '</textarea>' +
        '</div>' +
        '<div class="topic-actions">' +
          '<button class="btn-small btn-primary" data-approve="' + t.id + '">Approve</button>' +
          '<button class="btn-small btn-secondary" data-save="' + t.id + '">Save draft</button>' +
        '</div>' +
      '</div>';
    });

    document.getElementById("topicList").innerHTML = html;

    // Wire handlers
    document.querySelectorAll("[data-approve]").forEach(function(btn) {
      btn.addEventListener("click", function() { saveTopic(btn.getAttribute("data-approve"), "approved"); });
    });
    document.querySelectorAll("[data-save]").forEach(function(btn) {
      btn.addEventListener("click", function() { saveTopic(btn.getAttribute("data-save"), "draft"); });
    });
  }

  async function saveTopic(topicId, status) {
    var textarea = document.querySelector('textarea[data-topic-id="' + topicId + '"]');
    if (!textarea) return;
    var text = textarea.value.trim();

    try {
      await api({ action: "updateShortDescription", topicId: topicId, shortDescription: text, status: status });
      // Update local data
      var t = TOPICS.find(function(t) { return t.id === topicId; });
      if (t) { t.short_description = text; t.short_description_status = status; }
      render();
      showStatus(status === "approved" ? "Approved" : "Saved as draft", "ok");
    } catch(e) {
      showStatus("Failed to save", "err");
    }
  }

  document.getElementById("approveAllBtn").addEventListener("click", async function() {
    var ids = TOPICS.filter(function(t) { return t.short_description && t.short_description_status !== "approved"; }).map(function(t) { return t.id; });
    // Also save any edited text first
    var textareas = document.querySelectorAll("textarea[data-topic-id]");
    for (var i = 0; i < textareas.length; i++) {
      var ta = textareas[i];
      var tid = ta.getAttribute("data-topic-id");
      var text = ta.value.trim();
      var topic = TOPICS.find(function(t) { return t.id === tid; });
      if (topic && text !== (topic.short_description || "")) {
        await api({ action: "updateShortDescription", topicId: tid, shortDescription: text, status: "draft" });
        topic.short_description = text;
        if (text && !ids.includes(tid)) ids.push(tid);
      }
    }

    if (ids.length === 0) { showStatus("Nothing to approve", "info"); return; }

    try {
      await api({ action: "approveShortDescriptions", topicIds: ids });
      ids.forEach(function(id) {
        var t = TOPICS.find(function(t) { return t.id === id; });
        if (t) t.short_description_status = "approved";
      });
      render();
      showStatus("Approved " + ids.length + " description(s)", "ok");
    } catch(e) {
      showStatus("Failed to approve", "err");
    }
  });

  function showStatus(msg, type) {
    var el = document.getElementById("statusBar");
    el.className = "status status-" + type;
    el.textContent = msg;
    el.style.display = "block";
    if (type === "ok") setTimeout(function() { el.style.display = "none"; }, 3000);
  }

  function esc(s) { var d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }
</script>
</body>
</html>
