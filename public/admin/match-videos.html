MEDIA_VIDEOS.forEach(function(v) {
  var card = document.createElement('div');
  card.className = 'card';
  card.dataset.fileId = v.id;
  var thumb = 'https://static.wixstatic.com/media/' + v.id + 'f002.jpg';
  card.innerHTML = '<img src="' + thumb + '" alt="' + v.title + '" loading="lazy">' +
    '<div class="info">' +
    '<div class="title">' + v.title + '</div>' +
    '<div class="id">' + v.id + '</div>' +
    '<select onchange="onMatch(this)">' +
    '<option value="">-- Not a channel video --</option>' +
    CHANNEL_VIDEOS.map(function(cv, i) {
      return '<option value="' + i + '">[' + cv.ch + ' #' + cv.order + '] ' + cv.title + '</option>';
    }).join('') +
    '</select>' +
    '</div>';
  grid.appendChild(card);

function onMatch(sel) {
  var card = sel.closest('.card');
  card.classList.toggle('matched', sel.value !== '');
  updateStats();
}

function updateStats() {
  var matched = document.querySelectorAll('.card.matched').length;
  document.getElementById('stats').textContent = 'Matched: ' + matched + ' / 40';
}

function exportMatches() {
  var results = [];
  document.querySelectorAll('.card').forEach(function(card) {
    var sel = card.querySelector('select');
    if (sel.value === '') return;
    var cv = CHANNEL_VIDEOS[parseInt(sel.value)];
    results.push({
      wix_file_id: card.dataset.fileId,
      channel: cv.ch,
      channel_order: cv.order,
      channel_title: cv.title,
      category: cv.cat,
      on_course: cv.onCourse,
      media_title: card.querySelector('.title').textContent,
    });
  });

  // Generate SQL
  var sql = '-- Matched channel videos\\n';
  results.forEach(function(r) {
    var t = r.channel_title.replace(/'/g, "''");
    sql += "UPDATE videos SET title = '" + t + "', category = '" + r.category + "', " +
      "on_course = " + r.on_course + ", sort_order = " + r.channel_order +
      " WHERE wix_file_id = '" + r.wix_file_id + "';\\n";
  });

  var output = document.getElementById('output');
  output.style.display = 'block';
  output.textContent = JSON.stringify(results, null, 2) + '\\n\\n-- SQL --\\n' + sql;
}
